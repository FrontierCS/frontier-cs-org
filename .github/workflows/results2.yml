name: Evaluation results withdrawal
on:
  pull_request:
    paths:
      - '_config.yml'
      - '_pages/results2.html'
      - 'assets/**/results2*'
      - 'bin/*results2*'
      - '.github/workflows/results2.yml'
      - '.github/workflows/filter-files.yml'
  push:
    branches: [main]
    paths:
      - '_config.yml'
      - '_pages/results2.html'
      - 'assets/**/results2*'
      - 'bin/*results2*'
      - '.github/workflows/results2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m unittest discover -s bin -p 'test_results2*.py'
      - run: node --check assets/js/results2.js
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0.2'
          bundler-cache: true
      - name: Build production website
        run: JEKYLL_ENV=production bundle exec jekyll build
      - name: Verify public results are withdrawn
        run: |
          test -f _site/index.html
          test ! -e _site/results2
          test ! -e _site/assets/data/results2.json
          test ! -e _site/assets/css/results2.css
          test ! -e _site/assets/js/results2.js
          ! grep -q '/results2/' _site/sitemap.xml
      - uses: actions/upload-artifact@v4
        with:
          name: website-without-results2
          path: _site
