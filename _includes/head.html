    <!-- Metadata, OpenGraph and Schema.org -->
    {% include metadata.html %}

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='4.5 14.44 81.06 81.06'%3E%3Cpath d='M10 40 A50 50 0 0 1 60 90' fill='none' stroke='%231F1F1F' stroke-width='11' stroke-linecap='round'/%3E%3Cpath d='M50.45 19.94 A80.9 80.9 0 0 1 80.06 49.55' fill='none' stroke='%230B57D0' stroke-width='11' stroke-linecap='round'/%3E%3C/svg%3E"/>
    <meta name="theme-color" content="#ffffff">
    <link rel="canonical" href="{{ page.url | replace:'index.html','' | absolute_url }}">

    <!-- Styles: Hanken Grotesk (text), Instrument Sans (wordmark), Google Sans Code (code) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Instrument+Sans:wght@500&family=Google+Sans+Code:wght@400;500&display=swap">
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
    {% if page.page_css %}<link rel="stylesheet" href="{{ '/assets/css/' | append: page.page_css | append: '.css' | relative_url }}">{% endif %}

    {% if page._styles %}
    <!-- Page/Post style -->
    <style type="text/css">
      {{ page._styles }}
    </style>
    {% endif %}
