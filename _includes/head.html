    <!-- Metadata, OpenGraph and Schema.org -->
    {% include metadata.html %}

    {% if site.icon and site.icon != '' and site.icon.size >= 3 %}
    <link rel="icon" type="image/png" href="{{ site.icon | prepend: '/assets/img/' | relative_url }}"/>
    <link rel="shortcut icon" type="image/png" href="{{ site.icon | prepend: '/assets/img/' | relative_url }}"/>
    {% else %}
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23003262' rx='4'/%3E%3Ctext x='16' y='22' font-family='Georgia, serif' font-size='20' font-weight='bold' fill='%23f6c85f' text-anchor='middle'%3EF%3C/text%3E%3C/svg%3E"/>
    {% endif %}
    <meta name="theme-color" content="#F6F3EC">
    <link rel="canonical" href="{{ page.url | replace:'index.html','' | absolute_url }}">

    <!-- Colour scheme before first paint: follows the OS, T key toggles, stored in localStorage -->
    <script>try{var st=localStorage.getItem("site-theme");if(st==="midnight"||(!st&&matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.setAttribute("data-theme","midnight")}catch(e){}</script>

    <!-- Styles (self-hosted Newsreader / Inter Tight / JetBrains Mono) -->
    <link rel="preload" href="{{ '/assets/fonts/Newsreader-normal-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">

    {% if page._styles %}
    <!-- Page/Post style -->
    <style type="text/css">
      {{ page._styles }}
    </style>
    {% endif %}
