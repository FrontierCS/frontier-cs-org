    <!-- Metadata, OpenGraph and Schema.org -->
    {% include metadata.html %}

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='49 47 81 100'%3E%3Cpath d='M59.78 135.86 L75.94 71.24 A17.5 17.5 0 0 1 92.89 58 L118.5 58' fill='none' stroke='%230B57D0' stroke-width='21' stroke-linecap='round'/%3E%3Ccircle cx='109' cy='97' r='10.5' fill='%230B57D0'/%3E%3C/svg%3E"/>

    <link rel="canonical" href="{{ page.url | replace:'index.html','' | absolute_url }}">

    {% if page.page_css %}<link rel="stylesheet" href="{{ '/assets/css/' | append: page.page_css | append: '.css' | relative_url }}">{% endif %}

    {% if page._styles %}
    <!-- Page/Post style -->
    <style type="text/css">
      {{ page._styles }}
    </style>
