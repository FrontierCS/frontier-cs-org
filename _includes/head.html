    <!-- Metadata, OpenGraph and Schema.org -->
    {% include metadata.html %}

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-12 -75.7 87.7 87.7'%3E%3Crect x='-12' y='-75.7' width='87.7' height='87.7' rx='20' fill='%23FFF'/%3E%3Cpath d='M0 -50 A50 50 0 0 1 50 0' fill='none' stroke='%231F1F1F' stroke-width='11' stroke-linecap='round'/%3E%3Crect x='45.2' y='-69.2' width='24' height='24' rx='5.5' fill='%230B57D0'/%3E%3C/svg%3E"/>
    <meta name="theme-color" content="#ffffff">
    <link rel="canonical" href="{{ page.url | replace:'index.html','' | absolute_url }}">

    <!-- Styles: Hanken Grotesk (text), Instrument Sans (wordmark), Google Sans Code (code) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Instrument+Sans:wght@500&family=Google+Sans+Code:wght@400;500;700&display=swap">
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
    {% for css in page.page_css %}<link rel="stylesheet" href="{{ '/assets/css/' | append: css | append: '.css' | relative_url }}">{% endfor %}

    {% if page._styles %}
    <!-- Page/Post style -->
    <style type="text/css">
      {{ page._styles }}
    </style>
    {% endif %}
