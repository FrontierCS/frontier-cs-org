<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 420" font-family="'Hanken Grotesk', 'Helvetica Neue', Arial, sans-serif"><rect width="1040" height="420" fill="#fff"/><rect x="30" y="90" width="250" height="220" rx="10" fill="#fff" stroke="#1f1f1f" stroke-width="2"/><text x="155.0" y="206.0" font-size="16" font-weight="500" fill="#1f1f1f" text-anchor="middle"></text><text x="155" y="128" font-size="18" font-weight="600" fill="#1f1f1f" text-anchor="middle">Agent container</text><text x="155" y="152" font-size="14" font-weight="400" fill="#5f6368" text-anchor="middle">no local GPU</text><rect x="80" y="180" width="150" height="50" rx="10" fill="#d3e3fd" stroke="#0b57d0" stroke-width="2"/><text x="155.0" y="211.0" font-size="16" font-weight="600" fill="#1f1f1f" text-anchor="middle">Agent</text><text x="155" y="270" font-size="14" font-weight="400" fill="#5f6368" text-anchor="middle">uses the GPU through the API</text><rect x="360" y="250" width="220" height="130" rx="10" fill="#fff" stroke="#1f1f1f" stroke-width="2"/><text x="470.0" y="321.0" font-size="16" font-weight="500" fill="#1f1f1f" text-anchor="middle"></text><text x="470" y="290" font-size="18" font-weight="600" fill="#1f1f1f" text-anchor="middle">Evaluator</text><text x="470" y="314" font-size="14" font-weight="400" fill="#5f6368" text-anchor="middle">hidden tests</text><text x="470" y="350" font-size="14" font-weight="400" fill="#5f6368" text-anchor="middle">CPU-only</text><rect x="680" y="60" width="340" height="330" rx="10" fill="#fff" stroke="#0b57d0" stroke-width="2"/><text x="850.0" y="231.0" font-size="16" font-weight="500" fill="#1f1f1f" text-anchor="middle"></text><text x="850" y="100" font-size="18" font-weight="600" fill="#0b57d0" text-anchor="middle">Modal GPU boundary</text><rect x="705" y="140" width="150" height="80" rx="10" fill="#d3e3fd" stroke="#0b57d0" stroke-width="2"/><text x="780.0" y="177.0" font-size="15" font-weight="600" fill="#1f1f1f" text-anchor="middle">vLLM endpoint</text><text x="780.0" y="197.0" font-size="13" font-weight="400" fill="#5f6368" text-anchor="middle">OpenAI-compatible</text><rect x="885" y="140" width="110" height="80" rx="10" fill="#f1f3f4" stroke="#dadce0" stroke-width="2"/><text x="940.0" y="177.0" font-size="16" font-weight="600" fill="#1f1f1f" text-anchor="middle">L40S</text><text x="940.0" y="197.0" font-size="13" font-weight="400" fill="#5f6368" text-anchor="middle">on demand</text><line x1="858" y1="172" x2="882" y2="172" stroke="#1f1f1f" stroke-width="2.5" stroke-linecap="round"/><path d="M872.1 167.2 L882 172 L872.1 176.8" fill="none" stroke="#1f1f1f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="882" y1="190" x2="858" y2="190" stroke="#1f1f1f" stroke-width="2.5" stroke-linecap="round"/><path d="M867.9 194.8 L858 190 L867.9 185.2" fill="none" stroke="#1f1f1f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="850" y="270" font-size="14" font-weight="400" fill="#1f1f1f" text-anchor="middle">Baseline, then the patched server,</text><text x="850" y="292" font-size="14" font-weight="400" fill="#1f1f1f" text-anchor="middle">measured one after the other</text><text x="850" y="350" font-size="13" font-weight="400" fill="#5f6368" text-anchor="middle">Caches hold weights, not evaluator secrets</text><path d="M234 196 H700" fill="none" stroke="#0b57d0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6"/><path d="M688 188 L702 196 L688 204" fill="none" stroke="#0b57d0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="465" y="186" font-size="14" font-weight="600" fill="#0b57d0" text-anchor="middle">controlled API</text><line x1="584" y1="320" x2="676" y2="320" stroke="#1f1f1f" stroke-width="2.5" stroke-linecap="round"/><path d="M666.1 315.2 L676 320 L666.1 324.8" fill="none" stroke="#1f1f1f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="630" y="310" font-size="13" font-weight="500" fill="#5f6368" text-anchor="middle">measure</text></svg>
