<svg xmlns="http://www.w3.org/2000/svg" class="wide" viewBox="0 0 760 262" font-family="&#x27;Hanken Grotesk&#x27;, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" role="img" aria-label="The judge runs the candidate&#x27;s code inside a sandbox of its own, which cannot read the judge&#x27;s files or keep anything between runs."><rect x="1" y="1" width="758" height="260" rx="10" fill="#f8f9fa" stroke="#dadce0" stroke-width="1.5"/><text x="20.0" y="30.0" font-size="15" font-weight="700" fill="#1f1f1f">The judge (trusted)</text><rect x="20" y="66" width="250" height="96" rx="10" fill="#ffffff" stroke="#dadce0" stroke-width="1.5"/><text x="36.0" y="96.0" font-size="13" font-weight="700" fill="#1f1f1f">judge files</text><text x="36.0" y="120.0" font-size="13" font-weight="400" fill="#5f6368">hidden workloads, the human</text><text x="36.0" y="140.0" font-size="13" font-weight="400" fill="#5f6368">reference, the scoring code</text><rect x="400" y="20" width="340" height="176" rx="10" fill="#e8f0fe" stroke="#0b57d0" stroke-width="1.5" stroke-dasharray="5 4"/><text x="418.0" y="48.0" font-size="15" font-weight="700" fill="#0b57d0">isolate: the candidate's code</text><text x="418.0" y="80.0" font-size="13" font-weight="500" fill="#1f1f1f">reads only its own tree and inputs</text><text x="418.0" y="104.0" font-size="13" font-weight="500" fill="#1f1f1f">writes only its result folder</text><text x="418.0" y="128.0" font-size="13" font-weight="500" fill="#1f1f1f">no network, no extra processes</text><text x="418.0" y="152.0" font-size="13" font-weight="500" fill="#1f1f1f">a fresh instance for every run: nothing</text><text x="418.0" y="176.0" font-size="13" font-weight="500" fill="#1f1f1f">survives from one timing round to the next</text><line x1="394" x2="280" y1="114" y2="114" stroke="#c5221f" stroke-width="2"/><path d="M292 107 L278 114 L292 121" fill="none" stroke="#c5221f" stroke-width="2"/><path d="M326 103 L348 125 M348 103 L326 125" stroke="#c5221f" stroke-width="3"/><text x="337.0" y="148.0" font-size="13" font-weight="600" fill="#c5221f" text-anchor="middle">blocked</text><line x1="20" x2="740" y1="216" y2="216" stroke="#dadce0" stroke-width="1"/><text x="20.0" y="242.0" font-size="13" font-weight="500" fill="#1f1f1f">Attack submissions that read the judge, hide from its checks or keep state between rounds all score 0.</text></svg>
