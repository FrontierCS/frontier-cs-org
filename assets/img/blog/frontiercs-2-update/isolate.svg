<svg xmlns="http://www.w3.org/2000/svg" class="wide" viewBox="0 0 760 330" font-family="&#x27;Hanken Grotesk&#x27;, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" role="img" aria-label="The FrontierCS 2 judge: the Agent sends patches to the Driver; the Driver forwards them to the Judge, which holds the held-out suite and the reference. Inside the Judge, the agent&#x27;s code now runs in a sandbox of its own, isolate."><rect x="296" y="8" width="112" height="38" rx="10" fill="#f1f3f4"/><text x="352.0" y="31.7" font-size="13" font-weight="600" fill="#1f1f1f" text-anchor="middle">Model API</text><rect x="10" y="112" width="116" height="42" rx="10" fill="#d3e3fd"/><text x="68.0" y="137.9" font-size="13.5" font-weight="600" fill="#0b57d0" text-anchor="middle">Agent</text><text x="68.0" y="176.0" font-size="12" font-weight="400" fill="#5f6368" text-anchor="middle">No network but the Driver</text><rect x="296" y="112" width="112" height="42" rx="10" fill="#f1f3f4"/><text x="352.0" y="137.9" font-size="13.5" font-weight="600" fill="#1f1f1f" text-anchor="middle">Driver</text><line x1="126" y1="124" x2="294" y2="124" stroke="#5f6368" stroke-width="1.4"/><path d="M287 120 L294 124 L287 128 Z" fill="#5f6368"/><line x1="294" y1="142" x2="128" y2="142" stroke="#5f6368" stroke-width="1.4"/><path d="M135 138 L128 142 L135 146 Z" fill="#5f6368"/><text x="210.0" y="116.0" font-size="12" font-weight="500" fill="#1f1f1f" text-anchor="middle">Patch to the allowed files</text><text x="210.0" y="160.0" font-size="12" font-weight="500" fill="#1f1f1f" text-anchor="middle">Development score, sanitized</text><line x1="352" y1="112" x2="352" y2="48" stroke="#5f6368" stroke-width="1.4"/><path d="M348 55 L352 48 L356 55 Z" fill="#5f6368"/><rect x="296" y="210" width="112" height="40" rx="10" fill="#d3e3fd"/><text x="352.0" y="234.7" font-size="13" font-weight="600" fill="#0b57d0" text-anchor="middle">Agent GPU</text><text x="352.0" y="270.0" font-size="12" font-weight="400" fill="#5f6368" text-a