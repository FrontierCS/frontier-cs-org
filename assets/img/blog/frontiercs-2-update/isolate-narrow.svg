<svg xmlns="http://www.w3.org/2000/svg" class="narrow" viewBox="0 0 360 410" font-family="&#x27;Hanken Grotesk&#x27;, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" role="img" aria-label="The FrontierCS 2 judge: the Agent sends patches to the Driver; the Driver forwards them to the Judge, which holds the held-out suite and the reference. Inside the Judge, the agent&#x27;s code now runs in a sandbox of its own, isolate."><rect x="10" y="10" width="100" height="40" rx="10" fill="#d3e3fd"/><text x="60.0" y="34.9" font-size="13.5" font-weight="600" fill="#0b57d0" text-anchor="middle">Agent</text><text x="10.0" y="68.0" font-size="11" font-weight="400" fill="#5f6368">No network but the Driver</text><rect x="130" y="10" width="100" height="40" rx="10" fill="#f1f3f4"/><text x="180.0" y="34.9" font-size="13.5" font-weight="600" fill="#1f1f1f" text-anchor="middle">Driver</text><rect x="250" y="10" width="100" height="40" rx="10" fill="#f1f3f4"/><text x="300.0" y="34.5" font-size="12.5" font-weight="600" fill="#1f1f1f" text-anchor="middle">Model API</text><line x1="110" y1="24" x2="128" y2="24" stroke="#5f6368" stroke-width="1.4"/><path d="M121 20 L128 24 L121 28 Z" fill="#5f6368"/><line x1="128" y1="38" x2="112" y2="38" stroke="#5f6368" stroke-width="1.4"/><path d="M119 34 L112 38 L119 42 Z" fill="#5f6368"/><line x1="230" y1="30" x2="248" y2="30" stroke="#5f6368" stroke-width="1.4"/><path d="M241 26 L248 30 L241 34 Z" fill="#5f6368"/><rect x="10" y="90" width="340" height="310" rx="14" fill="#f1f3f4"/><text x="24.0" y="114.0" font-size="12.5" font-weight="600" fill="#5f6368">Evaluator</text><line x1="180" y1="50" x2="180" y2="126" stroke="#5f6368" stroke-width="1.4"/><path d="M176 119 L180 126 L184 119 Z" fill="#5f6368"/><rect x="24" y="128" width="312" height="174" rx="10" fill="#f9dedc"/><text x="38.0" y="152.0" font-size="14" font-weight="700" fill="#b3261e">Judge</text><text x="38.0" y="172.0" font-size="11.5" font-weight="400" fill="#b3261e">Held-out suite, reference score</text><rect x="38" y="186" width="284" height="102" rx="8" fill="#d3e3fd" stroke="#0b57d0" stroke-width="1.4" stroke-dasharray="5 4"/><text x="50.0" y="207.5" font-size="12.5" font-weight="700" fill="#0b57d0">The agent's code, in isolate</text><text x="50.0" y="227.0" font-size="11.5" font-weight="400" fill="#1f1f1f">its own files and inputs only</text><text x="50.0" y="246.5" font-size="11.5" font-weight="400" fill="#1f1f1f">no network</text><text x="50.0" y="266.0" font-size="11.5" font-weight="400" fill="#1f1f1f">a fresh copy for every run</text><rect x="24" y="318" width="148" height="40" rx="10" fill="#f9dedc"/><text x="98.0" y="342.5" font-size="12.5" font-weight="600" fill="#b3261e" text-anchor="middle">Judge GPU</text><rect x="188" y="318" width="148" height="40" rx="10" fill="#f9dedc"/><text x="262.0" y="342.5" font-size="12.5" font-weight="600" fill="#b3261e" text-anchor="middle">Test sandboxes</text><text x="98.0" y="378.0" font-size="11.5" font-weight="400" fill="#5f6368" text-anchor="middle">GPU tasks only</text><text x="262.0" y="378.0" font-size="11.5" font-weight="400" fill="#5f6368" text-anchor="middle">Some tasks only</text></svg>
