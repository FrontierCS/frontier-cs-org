<svg xmlns="http://www.w3.org/2000/svg" class="narrow" viewBox="0 0 360 430" font-family="&#x27;Hanken Grotesk&#x27;, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" role="img" aria-label="The judge runs the candidate&#x27;s code inside a sandbox of its own, which cannot read the judge&#x27;s files or keep anything between runs."><rect x="1" y="1" width="358" height="428" rx="10" fill="#f8f9fa" stroke="#dadce0" stroke-width="1.5"/><text x="14.0" y="24.0" font-size="12.5" font-weight="700" fill="#1f1f1f">The judge (trusted)</text><rect x="14" y="38" width="332" height="54" rx="10" fill="#ffffff" stroke="#dadce0" stroke-width="1.5"/><text x="28.0" y="60.0" font-size="11.5" font-weight="500" fill="#1f1f1f">judge files: hidden workloads,</text><text x="28.0" y="78.0" font-size="11.5" font-weight="500" fill="#1f1f1f">the human reference, the scoring code</text><line x1="180" x2="180" y1="176" y2="100" stroke="#c5221f" stroke-width="2"/><path d="M173 110 L180 98 L187 110" fill="none" stroke="#c5221f" stroke-width="2"/><path d="M169 127 L191 149 M191 127 L169 149" stroke="#c5221f" stroke-width="3"/><text x="200.0" y="143.0" font-size="11.5" font-weight="600" fill="#c5221f">blocked</text><rect x="14" y="182" width="332" height="170" rx="10" fill="#e8f0fe" stroke="#0b57d0" stroke-width="1.5" stroke-dasharray="5 4"/><text x="28.0" y="206.0" font-size="12.5" font-weight="700" fill="#0b57d0">isolate: the candidate's code</text><text x="28.0" y="232.0" font-size="11.5" font-weight="500" fill="#1f1f1f">reads only its own tree and inputs</text><text x="28.0" y="254.0" font-size="11.5" font-weight="500" fill="#1f1f1f">writes only its result folder</text><text x="28.0" y="276.0" font-size="11.5" font-weight="500" fill="#1f1f1f">no network, no extra processes</text><text x="28.0" y="298.0" font-size="11.5" font-weight="500" fill="#1f1f1f">a fresh instance for every run: nothing</text><text x="28.0" y="320.0" font-size="11.5" font-weight="500" fill="#1f1f1f">survives from one timing round to the next</text><text x="14.0" y="380.0" font-size="11.5" font-weight="500" fill="#1f1f1f">Attack submissions that read the judge, hide</text><text x="14.0" y="398.0" font-size="11.5" font-weight="500" fill="#1f1f1f">from its checks or keep state between rounds</text><text x="14.0" y="416.0" font-size="11.5" font-weight="500" fill="#1f1f1f">all score 0.</text></svg>
