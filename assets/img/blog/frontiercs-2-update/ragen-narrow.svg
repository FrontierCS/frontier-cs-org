<svg xmlns="http://www.w3.org/2000/svg" class="narrow" viewBox="0 0 360 314" font-family="&#x27;Hanken Grotesk&#x27;, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" role="img" aria-label="RAGEN: the patched file replaces the model&#x27;s moves with a search&#x27;s, so PPO trains on moves the model never chose."><rect x="10" y="10" width="200" height="54" rx="6" fill="#fff" stroke="#bdc1c6" stroke-width="1.2"/><text x="22.0" y="32.0" font-size="12.5" font-weight="600" fill="#1f1f1f">The model answers</text><text x="22.0" y="50.0" font-size="11.5" font-weight="400" fill="#5f6368">its moves for this turn</text><line x1="110.0" x2="110.0" y1="64" y2="86" stroke="#1f1f1f" stroke-width="1.4"/><rect x="10" y="90" width="200" height="54" rx="6" fill="#d3e3fd" stroke="#0b57d0" stroke-width="2"/><text x="22.0" y="112.0" font-size="12.5" font-weight="600" fill="#1f1f1f">The patched file</text><text x="22.0" y="130.0" font-size="11.5" font-weight="400" fill="#5f6368">parses the answer</text><line x1="110.0" x2="110.0" y1="144" y2="166" stroke="#1f1f1f" stroke-width="1.4"/><rect x="10" y="170" width="200" height="54" rx="6" fill="#fff" stroke="#bdc1c6" stroke-width="1.2"/><text x="22.0" y="192.0" font-size="12.5" font-weight="600" fill="#1f1f1f">Sokoban</text><text x="22.0" y="210.0" font-size="11.5" font-weight="400" fill="#5f6368">plays the moves</text><line x1="110.0" x2="110.0" y1="224" y2="246" stroke="#1f1f1f" stroke-width="1.4"/><rect x="10" y="250" width="200" height="54" rx="6" fill="#fff" stroke="#bdc1c6" stroke-width="1.2"/><text x="22.0" y="272.0" font-size="12.5" font-weight="600" fill="#1f1f1f">PPO</text><text x="22.0" y="290.0" font-size="11.5" font-weight="400" fill="#5f6368">trains on the history</text><rect x="232" y="90" width="118" height="54" rx="6" fill="#fff" stroke="#b3261e" stroke-width="1.6"/><text x="242.0" y="112.0" font-size="12.5" font-weight="600" fill="#b3261e">A search</text><text x="242.0" y="130.0" font-size="11.5" font-weight="400" fill="#5f6368">solves the board</text><line x1="232" x2="214" y1="117.0" y2="117.0" stroke="#b3261e" stroke-width="1.6"/><text x="118.0" y="82.0" font-size="11.5" font-weight="600" fill="#b3261e">moves dropped</text></svg>
