<svg xmlns="http://www.w3.org/2000/svg" class="wide" viewBox="0 0 760 210" font-family="&#x27;Hanken Grotesk&#x27;, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" role="img" aria-label="RAGEN: the patched file replaces the model&#x27;s moves with a search&#x27;s, so PPO trains on moves the model never chose."><rect x="10" y="26" width="150" height="64" rx="6" fill="#fff" stroke="#bdc1c6" stroke-width="1.2"/><text x="22.0" y="52.0" font-size="13" font-weight="600" fill="#1f1f1f">The model answers</text><text x="22.0" y="72.0" font-size="12" font-weight="400" fill="#5f6368">its moves for this turn</text><line x1="160" x2="201" y1="58.0" y2="58.0" stroke="#1f1f1f" stroke-width="1.4"/><path d="M201 54.0 L207 58.0 L201 62.0 Z" fill="#1f1f1f"/><rect x="207" y="26" width="150" height="64" rx="6" fill="#d3e3fd" stroke="#0b57d0" stroke-width="2"/><text x="219.0" y="52.0" font-size="13" font-weight="600" fill="#1f1f1f">The patched file</text><text x="219.0" y="72.0" font-size="12" font-weight="400" fill="#5f6368">parses the answer</text><line x1="357" x2="398" y1="58.0" y2="58.0" stroke="#1f1f1f" stroke-width="1.4"/><path d="M398 54.0 L404 58.0 L398 62.0 Z" fill="#1f1f1f"/><rect x="404" y="26" width="150" height="64" rx="6" fill="#fff" stroke="#bdc1c6" stroke-width="1.2"/><text x="416.0" y="52.0" font-size="13" font-weight="600" fill="#1f1f1f">Sokoban</text><text x="416.0" y="72.0" font-size="12" font-weight="400" fill="#5f6368">plays the moves</text><line x1="554" x2="595" y1="58.0" y2="58.0" stroke="#1f1f1f" stroke-width="1.4"/><path d="M595 54.0 L601 58.0 L595 62.0 Z" fill="#1f1f1f"/><rect x="601" y="26" width="150" height="64" rx="6" fill="#fff" stroke="#bdc1c6" stroke-width="1.2"/><text x="613.0" y="52.0" font-size="13" font-weight="600" fill="#1f1f1f">PPO</text><text x="613.0" y="72.0" font-size="12" font-weight="400" fill="#5f6368">trains on the history</text><rect x="207" y="140" width="150" height="56" rx="6" fill="#fff" stroke="#b3261e" stroke-width="1.6"/><text x="219.0" y="164.0" font-size="12.5" font-weight="600" fill="#b3261e">A search the patch adds</text><text x="219.0" y="182.0" font-size="12" font-weight="400" fill="#5f6368">solves each board</text><line x1="282.0" x2="282.0" y1="140" y2="96" stroke="#b3261e" stroke-width="1.6"/><path d="M278.0 96 L282.0 90 L286.0 96 Z" fill="#b3261e"/><line x1="174" x2="189" y1="49.0" y2="67.0" stroke="#b3261e" stroke-width="2"/><text x="168.0" y="112.0" font-size="12" font-weight="600" fill="#b3261e">moves dropped</text><text x="404.0" y="164.0" font-size="12.5" font-weight="500" fill="#1f1f1f">The game is solved and PPO runs,</text><text x="404.0" y="182.0" font-size="12.5" font-weight="500" fill="#1f1f1f">but on moves the model never chose.</text></svg>
