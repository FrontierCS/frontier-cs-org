<svg xmlns="http://www.w3.org/2000/svg" class="fig2" viewBox="0 0 760 296" role="img" aria-label="Left, what is given: the matrix A after reordering, with eight neighboring rows outlined as one cluster, and the rows 1, 4, 5 and 9 of B that the cluster reads. Middle, what the agent writes: the clustered format and its multiply. Clustered A stores each column id of the cluster once, here 1, 4, 5 and 9, with eight lane values. Row 4 of B is read once: its entry B[4,7] scales all eight lanes of column 4, and the product is added into the output. Each row of B is read once for all eight lanes. Right, the result: C, one output cluster with column ids 2, 7 and 11, eight output rows at once.">
