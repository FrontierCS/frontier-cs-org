<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-label="Eight neighboring rows of the reordered matrix A form one cluster. The agent writes the clustered format, which stores each column id of the cluster once with eight lane values, and the multiply: row 4 of B is read once, its entry B[4,7] scales all eight lanes of column 4, and the result is added into column 7 of the output cluster C.">
