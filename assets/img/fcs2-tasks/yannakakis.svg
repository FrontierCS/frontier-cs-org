<svg xmlns="http://www.w3.org/2000/svg" class="fig2" viewBox="0 0 760 344" role="img" aria-label="Tables u = users, p = posts, c = comments; key 1 is u.Id = p.OwnerUserId and key 0 is p.Id = c.PostId. Left, the optimizer’s binary plan joins u and p on key 1, then c on key 0; its top join fails the shape rule because its leftmost table u lacks key 0. Middle, the tree rewrite the agent writes puts p first, keeping the same tables and join keys, so every join’s keys are in the leftmost table on both of its sides. Right, the result is lowered to a two-phase plan: semijoins on keys 1 and 0 first drop rows of p that cannot match, then the joins run on what is left.">
