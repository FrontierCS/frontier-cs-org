<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-label="Left, the optimizer’s binary plan joins u and p on key 1, then c on key 0; its top join fails the shape rule because its leftmost table u lacks key 0. Middle, the rewrite the agent writes puts p first, so every join’s keys are in the leftmost table of both sides. Right, fixed code lowers it to a two-phase plan: semijoins on keys 1 and 0 first drop rows of p that cannot match, then the joins run.">
