<svg xmlns="http://www.w3.org/2000/svg" class="fig2" viewBox="0 0 760 300" role="img" aria-label="Left, what is given: one block of the Vision Transformer, repeated through the model: LayerNorm, attention, add, LayerNorm, MLP, add. Right, what the agent writes. First, the DyT layer, DyT(x) = gamma times tanh of alpha x, plus beta, with alpha, gamma and beta learned at every site. Second, the conversion that puts DyT in place of every LayerNorm, so that none is left in the model.">
<defs><marker id="dyt-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="arh" d="M0 0L10 5L0 10z"/></marker></defs>
