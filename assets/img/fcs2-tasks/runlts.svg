<text x="326" y="141" font-size="11.5" fill="#1f1f1f" font-family="ui-monospace,Menlo,monospace">#4</text>
<text x="368" y="141" font-size="11.5" fill="#1f1f1f" >waiting</text>
<text x="238" y="159" font-size="11.5" fill="#1f1f1f" font-family="ui-monospace,Menlo,monospace">r7</text>
<text x="274" y="159" font-size="11.5" fill="#1f1f1f" font-family="ui-monospace,Menlo,monospace">9</text>
