<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 22 760 232" role="img" aria-label="Predicting a branch at address 0x1004 that tests register r3. Decode and execute events arrive out of order. The part the agent writes keeps a register table: r3 holds 42 from instruction 0 and is ready, r5 waits for instruction 4, and r7 holds 9 from instruction 5 but is stale because instruction 6 will replace it. A hash of the branch address and the value 42 picks a counter, +5, which is the register vote. The given statistical corrector adds it to the TAGE guess and other tables, minus 4 and plus 1, for a sum of plus 2: taken.">
<defs><marker id="runlts-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3c4043"/></marker></defs>
<text x="20" y="54" font-size="12" fill="#5f6368">events</text>
<text x="20" y="76" font-size="11.5" fill="#5f6368" font-family="ui-monospace,Menlo,monospace">decode</text>
<text x="86" y="76" font-size="11.5" fill="#1f1f1f" font-family="ui-monospace,Menlo,monospace">#0 r3</text>
<text x="20" y="95" font-size="11.5" fill="#5f6368" font-family="ui-monospace,Menlo,monospace">execute</text>
<text x="86" y="95" font-size="11.5" fill="#1f1f1f" font-family="ui-monospace,Menlo,monospace">#0 r3 = 42</text>
<text x="20" y="114" font-size="11.5" fill="#5f6368" font-family="ui-monospace,Menlo,monospace">decode</text>
<text x="86" y="114" font-size="11.5" fill="#1f1f1f" font-family="ui-monospace,Menlo,monospace">#4 r5</text>
<text x="20" y="133" font-size="11.5" fill="#5f6368" font-family="ui-monospace,Menlo,monospace">decode</text>
<text x="86" y="133" font-size="11.5" fill="#1f1f1f" font-family="ui-monospace,Menlo,monospace">#5 r7</text>
<text x="20" y="152" font-size="11.5" fill="#5f6368" font-family="ui-monospace,Menlo,monospace">decode</text>
<text x="86" y="152" font-size="11.5" fill="#1f1f1f" font-family="ui-monospace,Menlo,monospace">#6 r7</text>
<text x="20" y="171" font-size="11.5" fill="#5f6368" font-family="ui-monospace,Menlo,monospace">execute</text>
<text x="86" y="171" font-size="11.5" fill="#c5221f" font-family="ui-monospace,Menlo,monospace">#5 r7 = 9</text>
<text x="20" y="190" font-size="11.5" fill="#5f6368" font-family="ui-monospace,Menlo,monospace">predict</text>
<text x="86" y="190" font-size="11.5" fill="#1f1f1f" font-family="ui-monospace,Menlo,monospace">#7 0x1004</text>
<rect x="214" y="36" width="350" height="204" rx="12" fill="#e8f0fe" stroke="#0b57d0" stroke-width="1.5" stroke-dasharray="6 5"/>
<line x1="176" y1="124" x2="226" y2="124" stroke="#3c4043" stroke-width="1.3" marker-end="url(#runlts-ar)"/>
<text x="230" y="60" font-size="14" font-weight="600" fill="#0b57d0">The agent writes: the register-value vote</text>
<g transform="translate(0 -16)">
<rect x="232" y="92" width="36" height="18" fill="#fff" stroke="#3c4043" stroke-width="1"/>
