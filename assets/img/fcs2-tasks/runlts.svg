<rect x="362" y="146" width="104" height="18" fill="#fff" stroke="#3c4043" stroke-width="1"/>
<text x="238" y="123" font-size="11.5" fill="#1f1f1f" font-family="ui-monospace,Menlo,monospace">r3</text>
<text x="274" y="123" font-size="11.5" fill="#1f1f1f" font-family="ui-monospace,Menlo,monospace">42</text>
<text x="326" y="123" font-size="11.5" fill="#1f1f1f" font-family="ui-monospace,Menlo,monospace">#0</text>
<text x="368" y="123" font-size="11.5" fill="#1f1f1f" >ready</text>
<text x="238" y="141" font-size="11.5" fill="#1f1f1f" font-family="ui-monospace,Menlo,monospace">r5</text>
