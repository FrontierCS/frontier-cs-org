<rect x="484" y="238" width="46" height="18" fill="#fff" stroke="#3c4043" stroke-width="1"/>
<text x="507" y="251" font-size="11.5" text-anchor="middle" fill="#1f1f1f" font-family="ui-monospace,Menlo,monospace">0</text>
<rect x="484" y="256" width="46" height="18" fill="#fff" stroke="#3c4043" stroke-width="1"/>
<text x="507" y="269" font-size="11.5" text-anchor="middle" fill="#1f1f1f" font-family="ui-monospace,Menlo,monospace">−2</text>
</g>
<text x="232" y="185" font-size="12" fill="#1f1f1f" font-family="ui-monospace,Menlo,monospace">hash(0x1004, 42)</text>
<line x1="364" y1="181" x2="478" y2="181" stroke="#3c4043" stroke-width="1.3" marker-end="url(#runlts-ar)"/>
<line x1="532" y1="181" x2="590" y2="181" stroke="#3c4043" stroke-width="1.3" marker-end="url(#runlts-ar)"/>
<g transform="translate(0 -46)">
<text x="598" y="140" font-size="12" fill="#5f6368">corrector sum</text>
<text x="598" y="166" font-size="12" fill="#1f1f1f">TAGE guess</text>
<text x="740" y="166" font-size="12" text-anchor="end" fill="#1f1f1f" font-family="ui-monospace,Menlo,monospace">−4</text>
<text x="598" y="190" font-size="12" fill="#1f1f1f">other tables</text>
<text x="740" y="190" font-size="12" text-anchor="end" fill="#1f1f1f" font-family="ui-monospace,Menlo,monospace">+1</text>
