<svg xmlns="http://www.w3.org/2000/svg" class="fig2" viewBox="0 0 760 304" role="img" aria-label="Predicting the branch at address 0x1004, which tests register r3. Left, what is given: decode and execute events in simulator order; instructions execute out of order, so #5 writes r7 after #6 has claimed it. Middle, the register-value vote the agent writes, in three steps. 1, track values as they execute: r3 holds 42 from #0 and is ready, r5 waits for #4, and r7 holds 9 from #5 but #6 replaces it, so it is not used. 2, hash the branch address and the value 42 to pick a counter, +5. 3, train the counter when the branch resolves. Right, the given corrector adds the votes: the TAGE guess −4, other tables +1 and the register vote +5 sum to +2: taken.">
<defs><marker id="runlts-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="arh" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="given" x="0" y="0" width="200" height="304" rx="10"/>
<text class="k" x="18" y="30">GIVEN</text>
<text class="n" x="18" y="56">Simulator events</text>
<text class="code n" x="18" y="80">decode</text>
<text class="code" x="90" y="80">#0 r3</text>
<text class="code n" x="18" y="99">execute</text>
<text class="code" x="90" y="99">#0 r3 = 42</text>
<text class="code n" x="18" y="118">decode</text>
<text class="code" x="90" y="118">#4 r5</text>
<text class="code n" x="18" y="137">decode</text>
<text class="code" x="90" y="137">#5 r7</text>
<text class="code n" x="18" y="156">decode</text>
<text class="code" x="90" y="156">#6 r7</text>
<text class="code n" x="18" y="175">execute</text>
<text class="code bad" x="90" y="175">#5 r7 = 9</text>
<text class="code n" x="18" y="194">predict</text>
<text class="code" x="90" y="194">#7 0x1004</text>
<text class="n" x="18" y="226">Out of order: #5 runs</text>
<text class="n" x="18" y="244">after #6 has claimed r7.</text>
<text x="18" y="272">The branch at 0x1004</text>
<text x="18" y="290">tests r3.</text>
<rect class="agent" x="216" y="0" width="360" height="304" rx="10"/>
<text class="k ak" x="236" y="30">THE AGENT WRITES</text>
<text class="h" x="236" y="53">The register-value vote</text>
<circle class="chip" cx="245" cy="79.5" r="9"/><text class="sn ak" x="245" y="84" text-anchor="middle">1</text>
<text x="262" y="84">Track values as they execute</text>
<rect class="chip" x="236" y="96" width="320" height="90" rx="6"/>
<text class="n sm" x="248" y="114">reg</text>
<text class="n sm" x="288" y="114">value</text>
<text class="n sm" x="344" y="114">from</text>
<text class="n sm" x="396" y="114">state</text>
<line class="ln" x1="244" y1="121" x2="548" y2="121"/>
<text class="code" x="248" y="140">r3</text>
<text class="code" x="288" y="140">42</text>
<text class="code" x="344" y="140">#0</text>
<text x="396" y="140">ready</text>
<text class="code" x="248" y="160">r5</text>
<text class="code" x="288" y="160">–</text>
<text class="code" x="344" y="160">#4</text>
<text class="n" x="396" y="160">waiting</text>
<text class="code" x="248" y="180">r7</text>
<text class="code" x="288" y="180">9</text>
<text class="code" x="344" y="180">#5</text>
<text class="bad" x="396" y="180">replaced by #6</text>
<circle class="chip" cx="245" cy="211.5" r="9"/><text class="sn ak" x="245" y="216" text-anchor="middle">2</text>
<text x="262" y="216">Hash the branch and the value to a counter</text>
<rect class="chip" x="236" y="228" width="108" height="28" rx="6"/>
<text class="code mid" x="290.0" y="246.5">0x1004, 42</text>
<line class="ar" x1="352" y1="242" x2="384" y2="242" marker-end="url(#runlts-ar)"/>
<rect class="chip" x="392" y="228" width="30" height="28" rx="5"/>
<text class="num mid" x="407.0" y="246.5">−3</text>
<rect class="chip" x="426" y="228" width="30" height="28" rx="5"/>
<text class="num mid" x="441.0" y="246.5">+1</text>
<rect class="chip" x="460" y="228" width="30" height="28" rx="5"/>
<text class="num mid" x="475.0" y="246.5">0</text>
<rect class="chip" x="494" y="228" width="30" height="28" rx="5"/>
<text class="num mid" x="509.0" y="246.5">−2</text>
<rect class="chip on" x="528" y="228" width="30" height="28" rx="5"/>
<text class="num ak b mid" x="543.0" y="246.5">+5</text>
<circle class="chip" cx="245" cy="279.5" r="9"/><text class="sn ak" x="245" y="284" text-anchor="middle">3</text>
<text x="262" y="284">Train the counter when the branch resolves</text>
<rect class="result" x="592" y="0" width="168" height="304" rx="10"/>
<text class="k" x="610" y="30">CORRECTOR SUM</text>
<line class="ar" x1="566" y1="242" x2="600" y2="242" marker-end="url(#runlts-ar)"/>
<text class="n" x="610" y="58">The given corrector</text>
<text class="n" x="610" y="76">adds the votes.</text>
<text x="610" y="198">TAGE guess</text>
<text class="num end" x="742" y="198">−4</text>
<text x="610" y="222">other tables</text>
<text class="num end" x="742" y="222">+1</text>
<text class="ak b" x="610" y="246">register vote</text>
<text class="num end ak b" x="742" y="246">+5</text>
<line class="ln2" x1="610" y1="258" x2="742" y2="258"/>
<text class="b" x="610" y="282">sum +2: taken</text>
</svg>
