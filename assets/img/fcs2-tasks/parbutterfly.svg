<line class="sa" x1="52" y1="222" x2="196" y2="178"/>
<line class="sa" x1="52" y1="222" x2="196" y2="234"/>
<circle class="chip" cx="52" cy="78" r="15"/>
<text class="mid" x="52" y="82.5">u1</text>
<circle class="chip" cx="52" cy="150" r="15"/>
<text class="mid" x="52" y="154.5">u2</text>
<circle class="chip" cx="52" cy="222" r="15"/>
<text class="mid" x="52" y="226.5">u3</text>
<circle class="chip" cx="196" cy="66" r="15"/>
<text class="mid" x="196" y="70.5">v1</text>
<circle class="chip" cx="196" cy="122" r="15"/>
<text class="mid" x="196" y="126.5">v2</text>
<circle class="chip" cx="196" cy="178" r="15"/>
<text class="mid" x="196" y="182.5">v3</text>
<circle class="chip" cx="196" cy="234" r="15"/>
<text class="mid" x="196" y="238.5">v4</text>
<text class="n mid" x="52" y="268">side U</text>
<text class="n mid" x="196" y="268">side V</text>
<text class="ak" x="18" y="294">u2, u3, v3, v4: one butterfly</text>
<rect class="agent" x="266" y="0" width="494" height="312" rx="10"/>
<text class="k ak" x="286" y="30">THE AGENT WRITES</text>
<text class="h" x="286" y="53">The exact butterfly count, on four threads</text>
<text class="n" x="286" y="78">Any vertex order or way of grouping wedges is allowed.</text>
<text class="n sm" x="298" y="112">endpoints</text>
<text class="n sm" x="406" y="112">wedges, via</text>
<text class="n sm end" x="728" y="112">butterflies = w(w − 1)/2</text>
<rect class="chip" x="286" y="122" width="454" height="30" rx="6"/>
<text x="298" y="141.5">u1, u2</text>
<text x="406" y="141.5">3: v1, v2, v3</text>
