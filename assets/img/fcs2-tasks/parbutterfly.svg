<line class="ln2" x1="286" y1="236" x2="740" y2="236"/>
<text class="b" x="298" y="258">total</text>
<text class="num b end" x="728" y="258">4</text>
<text class="n" x="286" y="294">A wedge is a two-edge path between two vertices of side U.</text>
