<svg xmlns="http://www.w3.org/2000/svg" class="fig2" viewBox="0 0 760 312" role="img" aria-label="Left, what is given: a bipartite graph with vertices u1 to u3 on side U and v1 to v4 on side V; u2, u3, v3 and v4 form one butterfly. Right, the exact butterfly count the agent writes, on four threads, with any vertex order or way of grouping wedges. Wedges, two-edge paths between two vertices of side U, are grouped by endpoint pair: 3 for u1 and u2, 1 for u1 and u3, 2 for u2 and u3. Each group of w wedges gives w(w − 1)/2 butterflies, here 3, 0 and 1, so 4 in total.">
<defs><marker id="parbutterfly-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="arh" d="M0 0L10 5L0 10z"/></marker></defs>
