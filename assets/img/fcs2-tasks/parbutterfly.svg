<text x="298" y="177.5">u1, u3</text>
<text x="406" y="177.5">1: v3</text>
<text class="num end" x="728" y="177.5">0</text>
<rect class="chip on" x="286" y="194" width="454" height="30" rx="6"/>
<text x="298" y="213.5">u2, u3</text>
