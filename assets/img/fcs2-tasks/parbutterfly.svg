<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 26 760 235" role="img" aria-label="A bipartite graph with vertices u1 to u3 on one side and v1 to v4 on the other. The agent writes the exact count: wedges grouped by endpoint pair, 3 for u1 and u2, 1 for u1 and u3, 2 for u2 and u3, give 3, 0 and 1 butterflies, 4 in total. The bold butterfly is u2, u3, v3, v4.">
