<svg xmlns="http://www.w3.org/2000/svg" class="fig2" viewBox="0 0 760 270" role="img" aria-label="One training step. Left, what is given: the generator and a frozen feature model, which turn generated images into new features x = [2, 3]. Middle, the feature queue the agent writes: x replaces one row and keeps its gradient, while the stored rows carry no graph. The queue gives the mean [1.00, 1.25] and a 2 by 2 covariance, and its state saves and loads with the model. Right, the loss: a Fréchet distance to the target statistics, whose gradient reaches only the new features.">
<defs><marker id="differentiable-population-statistics-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="arh" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="given" x="0" y="0" width="172" height="270" rx="10"/>
<text class="k" x="18" y="30">GIVEN</text>
<rect class="chip" x="18" y="46" width="136" height="30" rx="6"/>
<text class="mid" x="86.0" y="65.5">Generator</text>
<line class="ar" x1="86.0" y1="78" x2="86.0" y2="96" marker-end="url(#differentiable-population-statistics-ar)"/>
<rect class="chip" x="18" y="98" width="136" height="30" rx="6"/>
<text class="mid" x="86.0" y="117.5">Frozen model</text>
<line class="ar" x1="86.0" y1="130" x2="86.0" y2="148" marker-end="url(#differentiable-population-statistics-ar)"/>
<rect class="chip" x="18" y="150" width="136" height="30" rx="6"/>
<text class="code mid" x="86.0" y="169.5">x = [2, 3]</text>
<text class="n mid" x="86.0" y="202">new features</text>
<rect class="agent" x="188" y="0" width="370" height="270" rx="10"/>
<text class="k ak" x="208" y="30">THE AGENT WRITES</text>
<text class="h" x="208" y="53">The feature queue of past features</text>
<rect class="chip on" x="208" y="74" width="42" height="26" rx="5"/>
<text class="code num b ak mid" x="229.0" y="91.5">2</text>
<rect class="chip on" x="253" y="74" width="42" height="26" rx="5"/>
<text class="code num b ak mid" x="274.0" y="91.5">3</text>
<rect class="chip" x="208" y="103" width="42" height="26" rx="5"/>
<text class="code num mid" x="229.0" y="120.5">1</text>
<rect class="chip" x="253" y="103" width="42" height="26" rx="5"/>
<text class="code num mid" x="274.0" y="120.5">0</text>
<rect class="chip" x="208" y="132" width="42" height="26" rx="5"/>
<text class="code num mid" x="229.0" y="149.5">0</text>
<rect class="chip" x="253" y="132" width="42" height="26" rx="5"/>
<text class="code num mid" x="274.0" y="149.5">1</text>
<rect class="chip" x="208" y="161" width="42" height="26" rx="5"/>
<text class="code num mid" x="229.0" y="178.5">1</text>
<rect class="chip" x="253" y="161" width="42" height="26" rx="5"/>
<text class="code num mid" x="274.0" y="178.5">1</text>
<line class="ar" x1="313" y1="87.0" x2="301" y2="87.0" marker-end="url(#differentiable-population-statistics-ar)"/>
<text x="317" y="91.5">new row, keeps its gradient</text>
<path class="ln" d="M303 105 H309 V185 H303"/>
<text class="n" x="317" y="149.5">stored rows, no graph</text>
<text class="code" x="208" y="214">μ = [1.00, 1.25]</text>
<text x="358" y="214">Σ = 2 × 2 covariance</text>
<text class="n" x="208" y="246">The state saves and loads with the model.</text>
<rect class="result" x="574" y="0" width="186" height="270" rx="10"/>
<text class="k" x="592" y="30">THE LOSS</text>
<rect class="chip" x="592" y="62" width="150" height="50" rx="6"/>
<text class="mid" x="667.0" y="83">Fréchet distance</text>
<text class="n mid" x="667.0" y="102">to the target μ, Σ</text>
<line class="ar" x1="667.0" y1="114" x2="667.0" y2="136" marker-end="url(#differentiable-population-statistics-ar)"/>
<rect class="chip" x="633.0" y="138" width="68" height="28" rx="6"/>
<text class="mid" x="667.0" y="156.5">loss</text>
<text class="n" x="592" y="206">The gradient reaches</text>
<text class="n" x="592" y="224">only the new features.</text>
<path class="ar" d="M156 165 H180 V87.0 H205" fill="none" marker-end="url(#differentiable-population-statistics-ar)"/>
<path class="ar" d="M508 209.5 H538 V87 H590" fill="none" marker-end="url(#differentiable-population-statistics-ar)"/>
</svg>
