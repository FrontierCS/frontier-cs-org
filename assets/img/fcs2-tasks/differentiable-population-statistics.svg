<svg xmlns="http://www.w3.org/2000/svg" class="fig2" viewBox="0 0 760 270" role="img" aria-label="One training step. Left, what is given: the generator and a frozen feature model, which turn generated images into new features x = [2, 3]. Middle, the feature queue the agent writes: x replaces one row and keeps its gradient, while the stored rows carry no graph. The queue gives the mean [1.00, 1.25] and a 2 by 2 covariance, and its state saves and loads with the model. Right, the loss: a Fréchet distance to the target statistics, whose gradient reaches only the new features.">
