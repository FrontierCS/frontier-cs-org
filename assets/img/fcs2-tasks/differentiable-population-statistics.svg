<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 22 760 238" role="img" aria-label="One training step. The generator’s images pass through a frozen feature model, giving new features x = [2, 3]. The agent writes the feature queue: x replaces one row and keeps its gradient, while stored rows carry no graph. The queue gives the mean [1.00, 1.25] and a covariance, which feed a Fréchet distance to target statistics. The loss gradient flows back only through the new features.">
