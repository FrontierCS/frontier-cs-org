<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 18 760 278" role="img" aria-label="A fixed IVF-PQ index stores each database vector in one of 8,192 lists as its id and 16 short codes, for example vector 1043 with codes 17, 201, 3 and so on up to 88. The agent writes the whole search: probe the nearest lists for query q, build the query’s distance table with one row per sub-space, add up one table entry per code to get each vector’s distance, such as 41230, and keep the best k.">
