<svg xmlns="http://www.w3.org/2000/svg" class="fig2" viewBox="0 0 760 312" role="img" aria-label="Left, what is given: list 4071 of the index, where each vector id carries 16 codes, for example 1043 with codes 17, 201, 3 up to 88; there are 8,192 lists, each around a centroid, and a code names one codebook entry. Right, the search the agent writes, from probing lists to top-k: probe the nearest 32 to 128 lists, build the distance table T for the query (one row per vector part, one column per code value), scan by adding one table entry per code, d = T[1][17] + T[2][201] + ... + T[16][88] = 41230, and keep the best k sorted.">
