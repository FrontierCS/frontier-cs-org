<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 37 760 218" role="img" aria-label="One training step of the DeTok tokenizer on a 4 by 4 grid of patches. Most patches are hidden, the encoder turns the visible ones into latent tokens, noise is added to them, hidden positions are filled and the grid is restored to order, and the decoder rebuilds the clean image. The agent writes the hiding, the noise and the filling with restoration.">
