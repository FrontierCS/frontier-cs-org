<svg xmlns="http://www.w3.org/2000/svg" class="fig2" viewBox="0 0 760 262" role="img" aria-label="One training step of the DeTok tokenizer on a 4 by 4 grid of patches. Left, what is given: a training photo; the encoder and decoder are given too. Middle, the corruption the agent writes, in three steps. 1, hide most patches: 11 of 16 are hidden. The given encoder turns the 5 visible patches into latent tokens. 2, add noise to the latents. 3, fill the hidden positions, so the decoder gets the full grid in order; m marks a filled hidden position. Right, the result: the given decoder rebuilds the clean image, scored by PSNR. Evaluation stays clean.">
