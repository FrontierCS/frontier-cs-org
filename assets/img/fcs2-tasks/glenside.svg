<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" role="img" aria-label="Part of a Glenside e-graph for a small convolution. Classes of equal expressions hold the weights access, the data windows, their Cartesian product, and the dot product, which also holds an equivalent systolic-array form. Each class carries a fact of outer shape and item shape; the agent writes how these facts are built and merged.">
