<svg xmlns="http://www.w3.org/2000/svg" class="fig2" viewBox="0 0 760 334" role="img" aria-label="Left, what is given: part of a Glenside e-graph for a small convolution. Each grey box is a class of equal expressions: the weights access, the data windows, their Cartesian product, and the dot product, which also holds an equivalent systolic-array form. Right, what the agent writes: the fact on each class, its outer shape and item shape, plus known zero regions and accelerator use. The weights give [1] ‖ [1,2,2] and the windows [1,2,2] ‖ [1,2,2]; the Cartesian product builds [1,1,2,2] ‖ [2,1,2,2] from its children’s facts; and in the dot-product class both nodes give [1,1,2,2] ‖ [], so the facts merge when the classes join.">
