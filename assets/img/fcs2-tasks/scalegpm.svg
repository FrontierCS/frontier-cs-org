<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 20 760 274" role="img" aria-label="A measured query profile, with graph size, triangle count, maximum degree, pattern, error target, both engines’ settings and core count, goes to a chooser that picks neighborhood sampling or color sparsification. Sampling estimates the count from local samples; sparsification keeps edges whose ends share a color and counts exactly. The chooser is the part the agent writes.">
<defs><marker id="scalegpm-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3c4043"/></marker></defs>

<rect x="20" y="52" width="172" height="212" rx="8" fill="#fff" stroke="#3c4043" stroke-width="1.3"/>
<text x="32" y="76" font-size="12" fill="#5f6368">vertices</text>
<text x="180" y="76" font-size="12" text-anchor="end" fill="#1f1f1f" font-family="ui-monospace,Menlo,monospace">60,000</text>
<text x="32" y="98" font-size="12" fill="#5f6368">edge entries</text>
<text x="180" y="98" font-size="12" text-anchor="end" fill="#1f1f1f" font-family="ui-monospace,Menlo,monospace">839,976</text>
<text x="32" y="120" font-size="12" fill="#5f6368">triangles</text>
<text x="180" y="120" font-size="12" text-anchor="end" fill="#1f1f1f" font-family="ui-monospace,Menlo,monospace">900,082</text>
<text x="32" y="142" font-size="12" fill="#5f6368">max degree</text>
<text x="180" y="142" font-size="12" text-anchor="end" fill="#1f1f1f" font-family="ui-monospace,Menlo,monospace">20</text>
<text x="32" y="164" font-size="12" fill="#5f6368">pattern</text>
<text x="180" y="164" font-size="12" text-anchor="end" fill="#1f1f1f" font-family="ui-monospace,Menlo,monospace">triangle</text>
<text x="32" y="186" font-size="12" fill="#5f6368">error target</text>
<text x="180" y="186" font-size="12" text-anchor="end" fill="#1f1f1f" font-family="ui-monospace,Menlo,monospace">0.2</text>
<text x="32" y="208" font-size="12" fill="#5f6368">colors c</text>
<text x="180" y="208" font-size="12" text-anchor="end" fill="#1f1f1f" font-family="ui-monospace,Menlo,monospace">4</text>
<text x="32" y="230" font-size="12" fill="#5f6368">samples ns</text>
<text x="180" y="230" font-size="12" text-anchor="end" fill="#1f1f1f" font-family="ui-monospace,Menlo,monospace">41,447</text>
<text x="32" y="252" font-size="12" fill="#5f6368">cores</text>
<text x="180" y="252" font-size="12" text-anchor="end" fill="#1f1f1f" font-family="ui-monospace,Menlo,monospace">1</text>
<line x1="192" y1="160" x2="212" y2="160" stroke="#3c4043" stroke-width="1.3" marker-end="url(#scalegpm-ar)"/>
<rect x="214" y="100" width="270" height="120" rx="12" fill="#e8f0fe" stroke="#0b57d0" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="228" y="124" font-size="14" font-weight="600" fill="#0b57d0">The agent writes: the engine chooser</text>
<text x="228" y="146" font-size="12.5" fill="#3c4043">which engine will finish first</text>
<text x="228" y="164" font-size="12.5" fill="#3c4043">for this graph and these settings?</text>
<text x="228" y="196" font-size="12.5" fill="#0b57d0">returns sampling or sparsification</text>
<path d="M484 140 C 494 140, 486 96, 496 96" fill="none" stroke="#3c4043" stroke-width="1.3" marker-end="url(#scalegpm-ar)"/>
<path d="M484 180 C 494 180, 486 226, 496 226" fill="none" stroke="#3c4043" stroke-width="1.3" marker-end="url(#scalegpm-ar)"/>


<text x="502" y="46" font-size="13" font-weight="600" fill="#1f1f1f">Neighborhood sampling</text>
