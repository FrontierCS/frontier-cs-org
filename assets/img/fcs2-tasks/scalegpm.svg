<text x="634" y="80" font-size="12" fill="#5f6368">sample edges and</text>
<text x="634" y="97" font-size="12" fill="#5f6368">their neighbors,</text>
<text x="634" y="114" font-size="12" fill="#5f6368">estimate the count</text>
<text x="502" y="176" font-size="13" font-weight="600" fill="#1f1f1f">Color sparsification</text>
