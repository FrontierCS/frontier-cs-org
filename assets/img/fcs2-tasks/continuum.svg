<svg xmlns="http://www.w3.org/2000/svg" class="fig2" viewBox="0 0 760 284" role="img" aria-label="Left, what is given: vLLM 0.11.0 serving Qwen3-Coder-30B-A3B on one H100, and coding and tool-calling agents whose conversations alternate model turns with tool calls. Middle, what the agent writes: vLLM's scheduling and serving code, which decides which waiting request runs next and whose KV cache stays in GPU memory while a tool runs. Right, the benchmark: in each of four groups, SWE-bench and BFCL at a public and a hidden load, the conversations must finish faster than with the human reference, on average and at the 90th, 95th and 99th percentiles, with at least as many right answers.">
