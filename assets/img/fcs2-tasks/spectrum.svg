<text x="18" y="84">runs transactions in</text>
<text x="18" y="102">parallel, opcode by</text>
<text x="18" y="120">opcode, and rolls one</text>
<text x="18" y="138">back on a conflict</text>
<rect class="agent" x="196" y="0" width="564" height="330" rx="10"/>
