<svg xmlns="http://www.w3.org/2000/svg" class="fig2" viewBox="0 0 760 330" role="img" aria-label="Left, what is given: the executor, which runs each transaction opcode by opcode and rolls it back on a conflict. Right, the checkpointed stack the agent writes. One transaction saves checkpoints c1, c2 and c3, each holding the program position, pc 7, 12 and 19, and every value on the operand stack. Many checkpoints stay alive at once: c3 holds 99 where c2 still holds 20. A conflict restores c2, and the transaction runs on from there.">
<defs><marker id="spectrum-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="arh" d="M0 0L10 5L0 10z"/></marker></defs>
