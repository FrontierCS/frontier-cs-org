<svg xmlns="http://www.w3.org/2000/svg" class="fig2" viewBox="0 0 760 288" role="img" aria-label="Left, what is given: 1,024 queries and 500,000 database rows. Right, the whole search the agent writes: step 1, every squared distance from query q to the database rows, for example 41.2, 7.5, 88.0, 3.1, 19.6, 5.4, 63.0, 12.9, 50.3; step 2, the k smallest per query, in order: for k = 3, rows 3, 5 and 1 at distances 3.1, 5.4 and 7.5. One such list per query.">
