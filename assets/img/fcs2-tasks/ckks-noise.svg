<line class="ln" x1="586" y1="214" x2="742" y2="214"/>
<text class="sm n" x="586" y="148">real run</text>
<text class="sm ak end" x="742" y="148">estimate</text>
<text class="sm n" x="586" y="236">precision per slot, bits</text>
<text class="n" x="586" y="262">Each of 2,048 slots keeps</text>
