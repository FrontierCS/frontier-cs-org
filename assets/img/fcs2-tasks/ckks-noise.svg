<svg xmlns="http://www.w3.org/2000/svg" class="fig2" viewBox="0 0 760 296" role="img" aria-label="Left, what is given: two encrypted values, 1 + 0i and 0.5 + 0.25i, each at level 1 and scale 2 to the 45, with noise e1 and e2. Middle, what the agent writes: the noise kernels, which say how each operation changes a value’s noise: multiply adds m1 e2 + m2 e1 + e1 e2, relinearize adds key-switching noise, and rescale divides by Q1 and adds rounding noise; also summed products, division with rounding and key switching. Right, the result: 0.5 + 0.25i + e prime at level 0 and scale 2 to the 90 over Q1. Each of 2,048 slots gets a precision of minus log2 of its error, in bits; the estimated spread of precision per slot is compared with a real encrypted run.">
<defs><marker id="ckks-noise-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="arh" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="given" x="0" y="0" width="176" height="296" rx="10"/>
<text class="k" x="18" y="30">GIVEN</text>
<rect class="chip" x="18" y="48" width="140" height="70" rx="6"/>
<text class="code b" x="30" y="70">1 + 0i</text>
<text class="sm n" x="30" y="90">level 1 · scale 2⁴⁵</text>
<text class="sm n" x="30" y="107">noise e₁</text>
<rect class="chip" x="18" y="130" width="140" height="70" rx="6"/>
<text class="code b" x="30" y="152">0.5 + 0.25i</text>
<text class="sm n" x="30" y="172">level 1 · scale 2⁴⁵</text>
<text class="sm n" x="30" y="189">noise e₂</text>
<text class="n" x="18" y="230">Two encrypted</text>
<text class="n" x="18" y="248">values to multiply</text>
<rect class="agent" x="192" y="0" width="360" height="296" rx="10"/>
<text class="k ak" x="212" y="30">THE AGENT WRITES</text>
<text class="h" x="212" y="53">The noise kernels of each operation</text>
<circle class="chip" cx="221" cy="88" r="9"/><text class="sn ak" x="221" y="92.5" text-anchor="middle">1</text>
<rect class="chip on" x="238" y="74" width="104" height="28" rx="6"/>
<text class="mid" x="290.0" y="92.5">multiply</text>
<text x="356" y="92.5">+ m₁e₂ + m₂e₁ + e₁e₂</text>
<line class="ar" x1="290" y1="103" x2="290" y2="119" marker-end="url(#ckks-noise-ar)"/>
<circle class="chip" cx="221" cy="134" r="9"/><text class="sn ak" x="221" y="138.5" text-anchor="middle">2</text>
<rect class="chip on" x="238" y="120" width="104" height="28" rx="6"/>
<text class="mid" x="290.0" y="138.5">relinearize</text>
<text x="356" y="138.5">+ key-switching noise</text>
<line class="ar" x1="290" y1="149" x2="290" y2="165" marker-end="url(#ckks-noise-ar)"/>
<circle class="chip" cx="221" cy="180" r="9"/><text class="sn ak" x="221" y="184.5" text-anchor="middle">3</text>
<rect class="chip on" x="238" y="166" width="104" height="28" rx="6"/>
<text class="mid" x="290.0" y="184.5">rescale</text>
<text x="356" y="184.5">÷ Q₁, then + rounding</text>
<text class="n" x="212" y="236">Also summed products, division with</text>
<text class="n" x="212" y="254">rounding and key switching</text>
<rect class="result" x="568" y="0" width="192" height="296" rx="10"/>
<text class="k" x="586" y="30">RESULT</text>
<rect class="chip" x="586" y="48" width="156" height="70" rx="6"/>
<text class="code b" x="598" y="70">0.5 + 0.25i + e′</text>
<text class="sm n" x="598" y="90">level 0 · scale 2⁹⁰/Q₁</text>
<text class="sm n" x="598" y="107">noise e′</text>
