<svg xmlns="http://www.w3.org/2000/svg" class="fig2" viewBox="0 0 760 316" role="img" aria-label="Left, what is given: a newly grown tree that splits on stores.cluster ≤ 5 and items.f1 ≤ 958, with leaf values −5210.4, 903.2 and 1640.8, and the normalized tables: sales joins items by item_nbr and transactions by tid, and transactions join stores by store and holidays by date, which join oil by date. Right, the residual update the agent writes. 1, each sales row finds its leaf through the joins. 2, it takes the leaf value, scaled by the learning rate 0.5, off its residual: −5739.10 becomes −3133.90, 812.44 becomes 360.84 and 1503.27 becomes 682.87. All of it runs in SQL, without building the joined table.">
