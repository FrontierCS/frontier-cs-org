<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 22 760 263" role="img" aria-label="Polygon on LeetCode problem 1581: a correct query using NOT IN and a wrong answer using LEFT JOIN with amount IS NULL, over tables of at most two symbolic rows. The search loop, the part the agent writes, first commits to the choices join finds no match and NOT IN is true; the given Z3 solver answers unsat, and the conflict is learned. It then commits to join matches t1 and t1.amount is NULL; Z3 answers sat. The decoded database has visit 1 for customer 23 and transaction 5 for visit 1 with a NULL amount. MariaDB returns no rows for the correct query and customer 23 with count 1 for the wrong one, so they differ.">
<defs><marker id="polygon-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3c4043"/></marker></defs>

<text x="20" y="54" font-size="12" fill="#5f6368">correct query</text>
<text x="20" y="72" font-size="11.5" fill="#1f1f1f" font-family="ui-monospace,Menlo,monospace" xml:space="preserve">visit_id NOT IN</text>
<text x="20" y="88" font-size="11.5" fill="#1f1f1f" font-family="ui-monospace,Menlo,monospace" xml:space="preserve">(SELECT visit_id</text>
<text x="20" y="104" font-size="11.5" fill="#1f1f1f" font-family="ui-monospace,Menlo,monospace" xml:space="preserve"> FROM transactions)</text>
<text x="20" y="134" font-size="12" fill="#5f6368">wrong answer</text>
<text x="20" y="152" font-size="11.5" fill="#1f1f1f" font-family="ui-monospace,Menlo,monospace">visits LEFT JOIN</text>
<text x="20" y="168" font-size="11.5" fill="#1f1f1f" font-family="ui-monospace,Menlo,monospace">transactions</text>
<text x="20" y="184" font-size="11.5" fill="#1f1f1f" font-family="ui-monospace,Menlo,monospace">WHERE amount IS NULL</text>
<text x="20" y="214" font-size="11.5" fill="#5f6368">both group by customer_id</text>
<text x="20" y="230" font-size="11.5" fill="#5f6368">and count visits</text>
