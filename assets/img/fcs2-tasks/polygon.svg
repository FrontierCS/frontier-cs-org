<svg xmlns="http://www.w3.org/2000/svg" class="fig2" viewBox="0 0 760 284" role="img" aria-label="Polygon on LeetCode problem 1581. Left, what is given: a correct query using NOT IN and a wrong answer using LEFT JOIN with amount IS NULL; both group by customer_id and count visits. Middle, the search loop the agent writes. Try 1 commits to the choices join finds no match and NOT IN is true; the given Z3 solver answers unsat, and the loop learns this conflict. Try 2 commits to join matches t1 and t1.amount is NULL; Z3 answers sat, and the loop decodes the model. Right, the decoded database: visit 1 for customer 23, and transaction 5 for visit 1 with a NULL amount. MariaDB returns no rows for the correct query and customer 23 with count 1 for the wrong one, so they differ.">
<defs><marker id="polygon-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="arh" d="M0 0L10 5L0 10z"/></marker></defs>
<defs><marker id="polygon-ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arh" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="given" x="0" y="0" width="190" height="284" rx="10"/>
<text class="k" x="18" y="30">GIVEN</text>
<text class="n" x="18" y="58">Correct query</text>
<text class="code" x="18" y="78" xml:space="preserve">visit_id NOT IN</text>
<text class="code" x="18" y="94" xml:space="preserve">(SELECT visit_id</text>
<text class="code" x="18" y="110" xml:space="preserve"> FROM transactions)</text>
<text class="n" x="18" y="138">Wrong answer</text>
<text class="code" x="18" y="158">visits LEFT JOIN</text>
<text class="code" x="18" y="174">transactions</text>
<text class="code" x="18" y="190">WHERE amount IS NULL</text>
<text class="n" x="18" y="226">Both group by</text>
<text class="n" x="18" y="244">customer_id and</text>
<text class="n" x="18" y="262">count visits.</text>
<rect class="agent" x="206" y="0" width="328" height="284" rx="10"/>
<text class="k ak" x="226" y="30">THE AGENT WRITES</text>
<text class="h" x="226" y="53">The search loop</text>
<circle class="chip" cx="235" cy="81.5" r="9"/><text class="sn ak" x="235" y="86" text-anchor="middle">1</text>
<text x="252" y="86">Try 1</text>
<rect class="chip" x="226" y="98" width="136" height="26" rx="5"/>
<text class="mid" x="294.0" y="115.5">join: no match</text>
<rect class="chip" x="226" y="130" width="136" height="26" rx="5"/>
<text class="mid" x="294.0" y="147.5">NOT IN: true</text>
<line class="ar" x1="248" y1="160" x2="248" y2="230" marker-start="url(#polygon-ar2)" marker-end="url(#polygon-ar2)"/>
<circle class="chip" cx="387" cy="81.5" r="9"/><text class="sn ak" x="387" y="86" text-anchor="middle">2</text>
<text x="404" y="86">Try 2</text>
<rect class="chip on" x="378" y="98" width="136" height="26" rx="5"/>
<text class="mid" x="446.0" y="115.5">join: matches t1</text>
<rect class="chip on" x="378" y="130" width="136" height="26" rx="5"/>
<text class="mid" x="446.0" y="147.5">t1.amount: NULL</text>
<line class="ar" x1="400" y1="160" x2="400" y2="230" marker-start="url(#polygon-ar2)" marker-end="url(#polygon-ar2)"/>
<text class="b bad" x="260" y="189">unsat</text>
<text class="n" x="260" y="207">learn this conflict</text>
<text class="b" x="412" y="189">sat</text>
