<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-label="One query probes one norm partition held in five hash tables. It first reads its own bucket in each table, then further buckets in one global order across the tables. After each bucket, a stopping rule reads the result heap and the search state and decides whether to stop the partition or probe the next bucket. The stopping rule is the part the agent writes.">
