<svg xmlns="http://www.w3.org/2000/svg" class="fig2" viewBox="0 0 760 322" role="img" aria-label="Left, what is given: one norm partition held in five hash tables. A query first reads its own bucket in each table, then further buckets in one global probe order across the tables; the fourth bucket, from table T5 with score 0.42, was just read, and a result heap keeps the k-th best score, 0.77, on top. Right, the stopping rule the agent writes. After each bucket it reads the search state: k-th best score 0.77, bucket score 0.42, 4 buckets probed, 231 of 6,000 vectors checked, approximation ratio 0.8. Then it either stops and goes to the next partition, or probes on and reads bucket 5.">
