<svg xmlns="http://www.w3.org/2000/svg" class="fig2" viewBox="0 0 760 318" role="img" aria-label="Left, what is given: K centers by D, for example 1,024 by 128, and N points by D, for example 500,000 by 128. Right, the k-means step the agent writes: step 1 finds each point’s nearest center from the N by K distances (the dark cell is the row’s minimum, giving label 988); step 2 moves each center to the mean of its points: center 3 with 1,212 points and center 17 with 958 points move, center 402 with 0 points keeps the old one. The new centers feed the second step.">
