<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 30 760 274" role="img" aria-label="One Lloyd k-means step. Points, N by D, are compared with centers, K by D, giving an N by K grid of distances. Each row’s smallest distance gives the point’s label. Points are then summed and counted per center to give the new centers, which feed the second step. The whole step, nearest-center search and center update, is the part the agent writes.">
