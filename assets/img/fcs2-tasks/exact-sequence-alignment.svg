<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 20 760 304" role="img" aria-label="Path recovery for query ACGT and target ACCT with known distance 1. The edit table is split at its middle row. Scores from the top half going forward are 2 1 0 1 2, from the bottom half going backward 3 2 1 1 2; their sums 5 3 1 2 4 reach the distance 1 at column 2, where an optimal path crosses. Only the top-left and bottom-right quarters remain to be solved the same way. This recovery is the part the agent writes. The output path is match, match, mismatch, match.">
