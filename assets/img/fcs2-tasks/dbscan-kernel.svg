<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 296" role="img" aria-label="DBSCAN on a small point set with min_samples 4. Points with at least 4 points within radius eps are core points; linked core points form clusters 0 and 1; border points join a nearby cluster; isolated points are noise, labelled minus 1. The whole computation, from points to labels, is what the agent writes as GPU code; the result is checked against a plain DBSCAN.">
