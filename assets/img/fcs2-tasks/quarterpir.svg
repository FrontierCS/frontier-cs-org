<svg xmlns="http://www.w3.org/2000/svg" class="fig2" viewBox="0 0 760 300" role="img" aria-label="Left, what is given on the client: the authors’ request for entry x, 4 keys and 32 offsets, 100 bytes, and the hints from one pass over the database, each the XOR parity of its set. Middle, the server and its messages, which the agent writes. 1, shorten the request with a fixed public function. 2, the server XORs the entries the request selects. 3, it replies in a format of its own. 4, the client recovers entry x as its stored parity XOR the answer. The server sees only a public function of the authors’ request. Right, the server database, given: 4 superblocks of chunks; the dots mark one hint’s set, one entry per chunk.">
