<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 20 760 280" role="img" aria-label="The client holds hints: for each hint, the XOR parity of one entry from every chunk of the database. To look up entry x it forms the authors’ request of 4 keys and 32 offsets, 100 bytes. The agent writes the part in between: a public function that shortens that request, the server handler that XORs the entries the request selects, the redesigned answer, and the client step that combines its stored parity with the answer to recover entry x. The database, split into 4 superblocks of chunks, is given.">
