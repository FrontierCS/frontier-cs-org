<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 20 760 270" role="img" aria-label="A latent state z, for example 0.50 and minus 1.00, gets two noisy views. A spiral twists each view into an observation, and the encoder maps both to representations h. The agent writes the three losses on h: alignment pulls the two views together, SIGReg asks random one-dimensional projections of h to look standard normal, and whitening pushes the covariance of h toward the identity. Their gradients train the encoder. After training, linear fits test whether h recovers z up to a rotation.">
