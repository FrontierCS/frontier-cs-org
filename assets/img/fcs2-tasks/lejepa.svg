<svg xmlns="http://www.w3.org/2000/svg" class="fig2" viewBox="0 0 760 300" role="img" aria-label="Left, what is given: a latent z and two noisy views, for example z = (0.50, -1.00), z0 = (0.553, -0.716), z1 = (0.319, -0.919), twisted into a spiral and passed through the encoder, which outputs h for both views; gradients flow back to the encoder. Right, the three losses the agent writes: alignment pulls each row’s two views together; SIGReg makes random 1-D projections of h look standard normal; whitening pulls the covariance of h toward the identity.">
