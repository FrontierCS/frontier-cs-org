<svg xmlns="http://www.w3.org/2000/svg" class="fig2" viewBox="0 0 760 296" role="img" aria-label="Left, what is given: the heuristic, the better of two shortcuts. POP splits demands into three groups, each with a third of every link; demand pinning sends demands of 6 or less along their shortest path; exact linear programs replay every choice. Middle, the search the agent writes: it picks a demand of 0, 6 or 18 for each of 27 source-destination pairs, at most nine nonzero. Right, what it is judged on, in example throughputs: optimal 96, POP 66, pinning 74, a gap of 22.">
