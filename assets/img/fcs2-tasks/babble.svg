<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 26 760 249" role="img" aria-label="Two program fragments, (+ (car l) 1) and (+ (car m) 5), are crossed node by node into pairs of e-classes. Where the pair agrees the operator is kept, where it differs a hole is placed, giving the pattern (+ (car ?a) ?b). That pattern becomes the library function f a b, and the programs become (f l 1) and (f m 5). The crossing and candidate search are the part the agent writes.">
<defs><marker id="babble-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3c4043"/></marker></defs>

<g stroke="#3c4043" stroke-width="1.2">
<line x1="70" y1="90" x2="42" y2="116"/><line x1="70" y1="90" x2="100" y2="116"/><line x1="42" y1="140" x2="42" y2="166"/>
<line x1="190" y1="90" x2="162" y2="116"/><line x1="190" y1="90" x2="220" y2="116"/><line x1="162" y1="140" x2="162" y2="166"/>
</g>
<g fill="#fff" stroke="#3c4043" stroke-width="1.2">
<rect x="48" y="66" width="44" height="24" rx="5"/><rect x="20" y="116" width="44" height="24" rx="5"/><rect x="78" y="116" width="44" height="24" rx="5"/><rect x="20" y="166" width="44" height="24" rx="5"/>
<rect x="168" y="66" width="44" height="24" rx="5"/><rect x="140" y="116" width="44" height="24" rx="5"/><rect x="198" y="116" width="44" height="24" rx="5"/><rect x="140" y="166" width="44" height="24" rx="5"/>
</g>
<g font-size="12" text-anchor="middle" fill="#1f1f1f" font-family="ui-monospace,Menlo,monospace">
<text x="70" y="82">+</text><text x="42" y="132">car</text><text x="100" y="132">1</text><text x="42" y="182">l</text>
<text x="190" y="82">+</text><text x="162" y="132">car</text><text x="220" y="132">5</text><text x="162" y="182">m</text>
</g>
<text x="70" y="212" font-size="12" text-anchor="middle" fill="#5f6368">fragment A</text>
<text x="190" y="212" font-size="12" text-anchor="middle" fill="#5f6368">fragment B</text>
<text x="20" y="242" font-size="11.5" fill="#5f6368">each e-class also holds equal forms,</text>
<text x="20" y="258" font-size="11.5" fill="#5f6368">such as <tspan font-family="ui-monospace,Menlo,monospace">(+ 1 (car l))</tspan></text>
<rect x="262" y="40" width="338" height="212" rx="12" fill="#e8f0fe" stroke="#0b57d0" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="278" y="64" font-size="14" font-weight="600" fill="#0b57d0">The agent writes: the candidate search</text>
<text x="278" y="83" font-size="12.5" fill="#3c4043">cross e-classes in pairs; put a hole where they differ</text>
<line x1="250" y1="143" x2="296" y2="143" stroke="#3c4043" stroke-width="1.3" marker-end="url(#babble-ar)"/>
<g stroke="#3c4043" stroke-width="1.2">
<line x1="360" y1="130" x2="318" y2="156"/><line x1="360" y1="130" x2="408" y2="156"/><line x1="318" y1="180" x2="318" y2="206"/>
<line x1="540" y1="130" x2="514" y2="156"/><line x1="540" y1="130" x2="566" y2="156"/><line x1="514" y1="180" x2="514" y2="206"/>
</g>
<g fill="#fff" stroke="#3c4043" stroke-width="1.2">
<rect x="320" y="106" width="80" height="24" rx="5"/><rect x="278" y="156" width="80" height="24" rx="5"/>
<rect x="518" y="106" width="44" height="24" rx="5"/><rect x="492" y="156" width="44" height="24" rx="5"/>
</g>
<g fill="#fff" stroke="#3c4043" stroke-width="1.2" stroke-dasharray="3 3">
<rect x="544" y="156" width="44" height="24" rx="5"/><rect x="492" y="206" width="44" height="24" rx="5"/><rect x="368" y="156" width="80" height="24" rx="5"/><rect x="278" y="206" width="80" height="24" rx="5"/>
</g>
<g font-size="11.5" text-anchor="middle" fill="#1f1f1f" font-family="ui-monospace,Menlo,monospace">
<text x="360" y="122">(+, +)</text><text x="318" y="172">(car, car)</text><text x="408" y="172">(1, 5)</text><text x="318" y="222">(l, m)</text>
</g>
<g font-size="12" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">
<text x="540" y="122" fill="#1f1f1f">+</text><text x="514" y="172" fill="#1f1f1f">car</text><text x="566" y="172" fill="#0b57d0">?b</text><text x="514" y="222" fill="#0b57d0">?a</text>
</g>
<line x1="456" y1="143" x2="496" y2="143" stroke="#3c4043" stroke-width="1.3" marker-end="url(#babble-ar)"/>
<line x1="568" y1="118" x2="612" y2="118" stroke="#3c4043" stroke-width="1.3" marker-end="url(#babble-ar)"/>
<text x="620" y="96" font-size="12" fill="#5f6368">library function</text>
<text x="620" y="122" font-size="12" fill="#1f1f1f" font-family="ui-monospace,Menlo,monospace">f a b =</text>
<text x="620" y="140" font-size="12" fill="#1f1f1f" font-family="ui-monospace,Menlo,monospace">(+ (car a) b)</text>
<text x="620" y="186" font-size="12" fill="#5f6368">programs become</text>
<text x="620" y="208" font-size="12" fill="#1f1f1f" font-family="ui-monospace,Menlo,monospace">(f l 1)</text>
<text x="620" y="226" font-size="12" fill="#1f1f1f" font-family="ui-monospace,Menlo,monospace">(f m 5)</text>
</svg>
