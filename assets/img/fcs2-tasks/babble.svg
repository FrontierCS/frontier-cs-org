<svg xmlns="http://www.w3.org/2000/svg" class="fig2" viewBox="0 0 760 292" role="img" aria-label="Left, what is given: two program fragments, (+ (car l) 1) and (+ (car m) 5); each e-class also holds equal forms, such as (+ 1 (car l)). Middle, the candidate search the agent writes: it crosses two e-classes in pairs, giving (+, +) over (car, car) over (l, m), and (1, 5), then puts a hole wherever a pair differs, giving (+ (car ?a) ?b). It does this across the whole e-graph, by crossing its tree automaton with itself. Right, the result: the library function f a b = (+ (car a) b), and the programs become (f l 1) and (f m 5).">
<defs><marker id="babble-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="arh" d="M0 0L10 5L0 10z"/></marker></defs>
