<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 20 760 184" role="img" aria-label="Live training jobs, each needing 1, 2 or 4 GPUs, change their batch sizes as they train. The agent writes the per-round decision: which live jobs run next, here jobs 3, 6 and 7, needing 1, 1 and 2 GPUs, while jobs 1 and 4 wait. The given simulator places the chosen jobs on the four GPUs and advances training round by round.">
