<svg xmlns="http://www.w3.org/2000/svg" class="fig2" viewBox="0 0 760 268" role="img" aria-label="Left, what is given: live training jobs, each needing 1, 2 or 4 GPUs, whose batch sizes change as they train. Middle, the decision the agent writes each round: which live jobs run next, here jobs 3, 6 and 7, needing 1, 1 and 2 GPUs, while jobs 1 and 4 wait. Right, the given simulator places the chosen jobs on the four GPUs and advances training round by round.">
