<svg xmlns="http://www.w3.org/2000/svg" class="fig2" viewBox="0 0 760 300" role="img" aria-label="Left, what is given: one attention head of Qwen3-4B, with the keys K and values V of every token of a QuALITY article, a few sample queries, and a budget t for the head, a tenth of the article&#8217;s tokens overall. Right, what the agent writes: a small cache for the head in three steps. First, keep a few of the keys. Second, give each kept key a bias, so that together they draw the attention all the keys drew. Third, fit new values by least squares, so that for every sample query q, softmax of q C transposed plus beta, times C2, matches softmax of q K transposed, times V.">
<defs><marker id="kvc-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="arh" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="given" x="0" y="0" width="262" height="300" rx="10"/>
<text class="k" x="18" y="30">GIVEN</text>
<text class="b" x="18" y="56">One attention head</text>
<text class="code n" x="18" y="81">K</text>
<rect class="chip" x="36" y="70" width="14" height="16" rx="3"/>
<rect class="chip" x="53" y="70" width="14" height="16" rx="3"/>
