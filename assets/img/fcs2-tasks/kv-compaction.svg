<rect class="chip" x="223" y="92" width="14" height="16" rx="3"/>
<text class="n" x="18" y="132">a key and a value for every token</text>
<text class="code n" x="18" y="163">q</text>
<rect class="g3" x="36" y="152" width="14" height="16" rx="3"/>
<rect class="g3" x="53" y="152" width="14" height="16" rx="3"/>
<rect class="g3" x="70" y="152" width="14" height="16" rx="3"/>
<text class="n" x="96" y="164">sample queries</text>
<text class="b" x="18" y="200">A budget t for the head</text>
<text class="n" x="18" y="218">a tenth of the tokens overall</text>
<text x="18" y="254">Qwen3-4B answers questions</text>
<text x="18" y="272">on QuALITY articles</text>
<rect class="agent" x="278" y="0" width="482" height="300" rx="10"/>
<text class="k ak" x="298" y="30">THE AGENT WRITES</text>
<text class="h" x="298" y="53">A small cache that attends the same way</text>
<circle class="chip" cx="307" cy="83.5" r="9"/><text class="sn ak" x="307" y="88" text-anchor="middle">1</text>
<text x="324" y="88">Keep a few of the keys</text>
