<rect class="chip on" x="565" y="100" width="14" height="16" rx="3"/>
<text class="code n" x="590" y="112">C, at most t</text>
<circle class="chip" cx="307" cy="147.5" r="9"/><text class="sn ak" x="307" y="152" text-anchor="middle">2</text>
<text x="324" y="152">Give each kept key a bias β</text>
<text class="n sm" x="298" y="178">all keys</text>
<rect class="g3" x="400" y="170" width="150" height="7" rx="2"/>
<text class="n sm" x="298" y="196">kept keys, with β</text>
<rect class="fa" x="400" y="188" width="150" height="7" rx="2"/>
<text class="n sm" x="562" y="187">the same total attention</text>
<circle class="chip" cx="307" cy="227.5" r="9"/><text class="sn ak" x="307" y="232" text-anchor="middle">3</text>
<text x="324" y="232">Fit new values C₂ by least squares</text>
<rect class="chip on" x="298" y="244" width="300" height="34" rx="6"/>
<text class="code mid" x="448" y="265.5">softmax(qCᵀ + β) C₂ ≈ softmax(qKᵀ) V</text>
<text class="n" x="612" y="258">for every</text>
<text class="n" x="612" y="276">sample query q</text>
</svg>
