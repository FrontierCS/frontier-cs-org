<rect class="chip" x="223" y="70" width="14" height="16" rx="3"/>
<text class="code n" x="18" y="103">V</text>
<rect class="chip" x="36" y="92" width="14" height="16" rx="3"/>
<rect class="chip" x="53" y="92" width="14" height="16" rx="3"/>
<rect class="chip" x="70" y="92" width="14" height="16" rx="3"/>
<rect class="chip" x="87" y="92" width="14" height="16" rx="3"/>
<rect class="chip" x="104" y="92" width="14" height="16" rx="3"/>
<rect class="chip" x="121" y="92" width="14" height="16" rx="3"/>
<rect class="chip" x="138" y="92" width="14" height="16" rx="3"/>
