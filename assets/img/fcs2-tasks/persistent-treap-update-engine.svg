<svg xmlns="http://www.w3.org/2000/svg" class="fig2" viewBox="0 0 760 320" role="img" aria-label="Left, what is given: a stream of transactions such as insert 65, delete 10 and query 50 to 70. Middle, the update engine and its scheduler, which the agent writes: on several threads it publishes one whole tree per version. Inserting 65 into version 0, whose keys are 10 to 60, creates version 1 by copying the path 40, 60 and adding 65, while the subtree of 10, 20 and 30 is shared. Each node shows its key and the count of keys beneath it. Right, readers query any version at any time: 50 to 70 holds 1 key in version 0 and 2 in version 1.">
<defs><marker id="persistent-treap-update-engine-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="arh" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="given" x="0" y="0" width="164" height="320" rx="10"/>
<text class="k" x="18" y="30">GIVEN</text>
<text class="n" x="18" y="58">Transactions</text>
<text class="code" x="18" y="84">1 insert 65</text>
<text class="code" x="18" y="104">2 delete 10</text>
<text class="code" x="18" y="124">3 query 50–70</text>
<text class="code" x="18" y="144">…</text>
<text class="n" x="18" y="186">A node shows its key</text>
<text class="n" x="18" y="204">and Σ, the count of</text>
<text class="n" x="18" y="222">keys beneath it.</text>
<rect class="agent" x="180" y="0" width="416" height="320" rx="10"/>
<text class="k ak" x="200" y="30">THE AGENT WRITES</text>
<text class="h" x="200" y="53">The update engine and its scheduler</text>
<text class="n" x="200" y="78">Several threads, one whole tree per version.</text>
<text class="n" x="200" y="96">Insert 65 copies the path and shares the rest.</text>
<line class="ln2" x1="314.289" y1="179.389" x2="337.03" y2="203.879"/>
<line class="ln2" x1="476.289" y1="179.389" x2="499.03" y2="203.879"/>
<line class="ln2" x1="527.986" y1="235.665" x2="549.348" y2="259.589"/>
<line class="ln2" x1="286" y1="179" x2="256" y2="232"/>
<path class="chip" d="M250 228 L304.0 284 L196.0 284 Z"/>
<text class="n sm mid" x="250" y="258">Σ3</text>
<text class="code mid" x="250" y="275">10 20 30</text>
<text class="n mid" x="250" y="306">shared</text>
<path class="ln2" d="M450 182 C 422 314, 350 304, 290 262" marker-end="url(#persistent-treap-update-engine-ar)"/>
<circle class="chip" cx="300" cy="164" r="21"/>
<text class="b mid" x="300" y="163">40</text>
<text class="n sm mid" x="300" y="178">Σ5</text>
<circle class="chip" cx="352" cy="220" r="21"/>
<text class="b mid" x="352" y="219">60</text>
<text class="n sm mid" x="352" y="234">Σ1</text>
<circle class="chip on" cx="462" cy="164" r="21"/>
<text class="b mid" x="462" y="163">40</text>
<text class="n sm mid" x="462" y="178">Σ6</text>
<circle class="chip on" cx="514" cy="220" r="21"/>
<text class="b mid" x="514" y="219">60</text>
<text class="n sm mid" x="514" y="234">Σ2</text>
<circle class="chip on" cx="564" cy="276" r="21"/>
<text class="b mid" x="564" y="275">65</text>
<text class="n sm mid" x="564" y="290">Σ1</text>
<text class="b mid" x="300" y="121">v0</text>
<line class="ar" x1="300" y1="126" x2="300" y2="140" marker-end="url(#persistent-treap-update-engine-ar)"/>
<text class="b mid" x="462" y="121">v1</text>
<line class="ar" x1="462" y1="126" x2="462" y2="140" marker-end="url(#persistent-treap-update-engine-ar)"/>
<rect class="result" x="612" y="0" width="148" height="320" rx="10"/>
<text class="k" x="630" y="30">READERS</text>
<text class="n" x="630" y="58">Query any version</text>
<text class="code" x="630" y="84">v0 [50,70]: 1</text>
<text class="code" x="630" y="104">v1 [50,70]: 2</text>
<text class="n" x="630" y="140">Each reader sees a</text>
<text class="n" x="630" y="158">whole tree, never a</text>
<text class="n" x="630" y="176">half-built one.</text>
</svg>
