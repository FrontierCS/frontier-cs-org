<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 264" role="img" aria-label="Version 0 of a treap holds keys 10 to 60. Inserting 65 creates version 1 by copying the path 40, 60 and adding 65, while the subtree of 10, 20 and 30 is shared. Each node shows its key and the total count beneath it. The agent writes the update routines and their scheduler; readers query any version at any time.">
