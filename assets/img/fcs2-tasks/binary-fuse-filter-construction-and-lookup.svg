<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 35 760 255" role="img" aria-label="A binary fuse filter with 16 one-byte slots in four segments. Key x maps to one slot in each of segments 0, 1 and 2, key y to one slot in each of segments 1, 2 and 3. A lookup XORs the three slots and compares the result with the key’s fingerprint. The agent writes the construction that fills the slots.">

