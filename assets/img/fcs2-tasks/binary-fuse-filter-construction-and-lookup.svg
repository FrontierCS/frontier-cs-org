<text x="218" y="176" font-size="12" text-anchor="middle" fill="#5f6368">segment 0</text>
<text x="354" y="176" font-size="12" text-anchor="middle" fill="#5f6368">segment 1</text>
<text x="490" y="176" font-size="12" text-anchor="middle" fill="#5f6368">segment 2</text>
<text x="626" y="176" font-size="12" text-anchor="middle" fill="#5f6368">segment 3</text>
<text x="152" y="202" font-size="14" font-weight="600" fill="#0b57d0">The agent writes: the construction that fills every slot</text>
<text x="152" y="220" font-size="12.5" fill="#3c4043">so that each key’s three slots XOR to that key’s fingerprint</text>
<text x="20" y="258" font-size="12.5" fill="#5f6368">lookup x</text>
<text x="86" y="258" font-size="13" fill="#1f1f1f" font-family="ui-monospace,Menlo,monospace">3A ⊕ 5C ⊕ C1 = A7 = fingerprint(x)</text>
<text x="20" y="280" font-size="12.5" fill="#5f6368">lookup y</text>
<text x="86" y="280" font-size="13" fill="#1f1f1f" font-family="ui-monospace,Menlo,monospace">9E ⊕ 14 ⊕ 2B = A1 = fingerprint(y)</text>
<text x="440" y="258" font-size="12" fill="#5f6368">Each key uses one slot in each of three</text>
<text x="440" y="276" font-size="12" fill="#5f6368">consecutive segments; a match means present.</text>
</svg>
