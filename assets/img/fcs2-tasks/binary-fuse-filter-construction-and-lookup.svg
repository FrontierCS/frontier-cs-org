<svg xmlns="http://www.w3.org/2000/svg" class="fig2" viewBox="0 0 760 272" role="img" aria-label="Left, what is given: the keys, each hashed to one slot in each of three consecutive segments and to a short fingerprint, and the lookup, which XORs the three slots. Right, what the agent writes: the construction that fills every slot of the fingerprint array, 16 slots in four segments, so that each key’s three slots XOR to that key’s fingerprint. Key x uses slots holding 3A, 5C and C1, and 3A XOR 5C XOR C1 = A7 = fingerprint(x); key y uses 9E, 14 and 2B, and 9E XOR 14 XOR 2B = A1 = fingerprint(y). A match means present.">
<defs><marker id="binary-fuse-filter-construction-and-lookup-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="arh" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="given" x="0" y="0" width="180" height="272" rx="10"/>
<text class="k" x="18" y="30">GIVEN</text>
<text x="18" y="62">The keys, each hashed</text>
<text x="18" y="80">to one slot in each of</text>
<text x="18" y="98">three consecutive</text>
<text x="18" y="116">segments and to a</text>
<text x="18" y="134">short fingerprint</text>
<text x="18" y="172">The lookup, which</text>
<text x="18" y="190">XORs the three slots;</text>
<text x="18" y="208">a match means the</text>
<text x="18" y="226">key is present</text>
<rect class="agent" x="196" y="0" width="564" height="272" rx="10"/>
<text class="k ak" x="216" y="30">THE AGENT WRITES</text>
<text class="h" x="216" y="53">The construction that fills every slot</text>
<line class="ln2" x1="315" y1="96" x2="262.5" y2="140"/>
<line class="ln2" x1="315" y1="96" x2="455.5" y2="140"/>
