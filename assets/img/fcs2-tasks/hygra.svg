<svg xmlns="http://www.w3.org/2000/svg" class="fig2" viewBox="0 0 760 316" role="img" aria-label="Left, what is given: a hypergraph with vertices 0 to 5 and hyperedges e0 = {0, 1, 2}, e1 = {1, 2, 3}, e2 = {0, 1, 2, 3} and e3 = {3, 4}, stored both ways round. Right, the core-number computation the agent writes, by peeling: vertices sit in buckets by degree; level k = 0 peels 5, k = 1 peels 4 and drops e3, k = 2 peels the rest. The core numbers are 2, 2, 2, 2, 1, 0.">
