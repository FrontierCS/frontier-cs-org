<svg xmlns="http://www.w3.org/2000/svg" class="fig2" viewBox="0 0 760 316" role="img" aria-label="Left, what is given: a hypergraph with vertices 0 to 5 and hyperedges e0 = {0, 1, 2}, e1 = {1, 2, 3}, e2 = {0, 1, 2, 3} and e3 = {3, 4}, stored both ways round. Right, the core-number computation the agent writes, by peeling: vertices sit in buckets by degree; level k = 0 peels 5, k = 1 peels 4 and drops e3, k = 2 peels the rest. The core numbers are 2, 2, 2, 2, 1, 0.">
<defs><marker id="hygra-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="arh" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="given" x="0" y="0" width="268" height="316" rx="10"/>
<text class="k" x="18" y="30">GIVEN</text>
<line class="ln" x1="34" y1="87" x2="60" y2="170"/>
<line class="ln" x1="74" y1="87" x2="60" y2="170"/>
<line class="ln" x1="114" y1="87" x2="60" y2="170"/>
<line class="ln" x1="74" y1="87" x2="112" y2="170"/>
<line class="ln" x1="114" y1="87" x2="112" y2="170"/>
<line class="ln" x1="154" y1="87" x2="112" y2="170"/>
<line class="ln" x1="34" y1="87" x2="164" y2="170"/>
<line class="ln" x1="74" y1="87" x2="164" y2="170"/>
<line class="ln" x1="114" y1="87" x2="164" y2="170"/>
<line class="ln" x1="154" y1="87" x2="164" y2="170"/>
<line class="ln" x1="154" y1="87" x2="216" y2="170"/>
<line class="ln" x1="194" y1="87" x2="216" y2="170"/>
<circle class="chip" cx="34" cy="74" r="13"/>
<text class="num mid" x="34" y="78.5">0</text>
<circle class="chip" cx="74" cy="74" r="13"/>
<text class="num mid" x="74" y="78.5">1</text>
<circle class="chip" cx="114" cy="74" r="13"/>
<text class="num mid" x="114" y="78.5">2</text>
<circle class="chip" cx="154" cy="74" r="13"/>
<text class="num mid" x="154" y="78.5">3</text>
<circle class="chip" cx="194" cy="74" r="13"/>
<text class="num mid" x="194" y="78.5">4</text>
<circle class="chip" cx="234" cy="74" r="13"/>
<text class="num mid" x="234" y="78.5">5</text>
<rect class="chip" x="42" y="170" width="36" height="26" rx="5"/>
<text class="code mid" x="60.0" y="187.5">e0</text>
<rect class="chip" x="94" y="170" width="36" height="26" rx="5"/>
<text class="code mid" x="112.0" y="187.5">e1</text>
<rect class="chip" x="146" y="170" width="36" height="26" rx="5"/>
<text class="code mid" x="164.0" y="187.5">e2</text>
<rect class="chip" x="198" y="170" width="36" height="26" rx="5"/>
<text class="code mid" x="216.0" y="187.5">e3</text>
<text x="18" y="230">A hypergraph, stored both</text>
<text x="18" y="248">ways round: each vertex</text>
<text x="18" y="266">lists its edges, each edge</text>
<text x="18" y="284">lists its vertices</text>
<rect class="agent" x="284" y="0" width="476" height="316" rx="10"/>
<text class="k ak" x="304" y="30">THE AGENT WRITES</text>
<text class="h" x="304" y="53">The core-number computation, by peeling</text>
<circle class="chip" cx="313" cy="81.5" r="9"/><text class="sn ak mid" x="313" y="86">1</text>
<text x="330" y="86">Bucket the vertices by degree</text>
<rect class="chip" x="304" y="98" width="99" height="44" rx="6"/>
<text class="sm n mid" x="353.5" y="115">degree 0</text>
<text class="code mid" x="353.5" y="133">5</text>
<rect class="chip" x="411" y="98" width="99" height="44" rx="6"/>
<text class="sm n mid" x="460.5" y="115">degree 1</text>
<text class="code mid" x="460.5" y="133">4</text>
<rect class="chip" x="518" y="98" width="99" height="44" rx="6"/>
<text class="sm n mid" x="567.5" y="115">degree 2</text>
<text class="code mid" x="567.5" y="133">0</text>
<rect class="chip" x="625" y="98" width="99" height="44" rx="6"/>
<text class="sm n mid" x="674.5" y="115">degree 3</text>
<text class="code mid" x="674.5" y="133">1 2 3</text>
<circle class="chip" cx="313" cy="165.5" r="9"/><text class="sn ak mid" x="313" y="170">2</text>
<text x="330" y="170">Peel the lowest level, then the next</text>
<text class="n" x="330" y="194">k = 0: peel 5</text>
<text class="n" x="330" y="214">k = 1: peel 4 and drop e3; vertex 3 falls to degree 2</text>
<text class="n" x="330" y="234">k = 2: peel 0 and 3, drop e0, e1, e2; then 1 and 2</text>
<circle class="chip" cx="313" cy="265.5" r="9"/><text class="sn ak mid" x="313" y="270">3</text>
<text x="330" y="270">Core numbers</text>
<rect class="chip on" x="454" y="252" width="40" height="28" rx="5"/>
<text class="num b ak mid" x="474.0" y="270.5">2</text>
<text class="sm n mid" x="474.0" y="298">v0</text>
<rect class="chip on" x="498" y="252" width="40" height="28" rx="5"/>
<text class="num b ak mid" x="518.0" y="270.5">2</text>
<text class="sm n mid" x="518.0" y="298">v1</text>
<rect class="chip on" x="542" y="252" width="40" height="28" rx="5"/>
<text class="num b ak mid" x="562.0" y="270.5">2</text>
<text class="sm n mid" x="562.0" y="298">v2</text>
<rect class="chip on" x="586" y="252" width="40" height="28" rx="5"/>
<text class="num b ak mid" x="606.0" y="270.5">2</text>
<text class="sm n mid" x="606.0" y="298">v3</text>
<rect class="chip on" x="630" y="252" width="40" height="28" rx="5"/>
<text class="num b ak mid" x="650.0" y="270.5">1</text>
<text class="sm n mid" x="650.0" y="298">v4</text>
<rect class="chip on" x="674" y="252" width="40" height="28" rx="5"/>
<text class="num b ak mid" x="694.0" y="270.5">0</text>
<text class="sm n mid" x="694.0" y="298">v5</text>
</svg>
