<svg xmlns="http://www.w3.org/2000/svg" class="fig2" viewBox="0 0 760 312" role="img" aria-label="Left, what is given: two hash tables of one query. Each shows four projection values, the bits they give, the bucket key and the cost of flipping each bit, the squared projection. The vectors of each probed bucket get exact inner products, and the k best found so far feed the stop test. Right, the probe order and stop rule the agent writes: buckets from both tables, lowest distance first, where the distance is the sum of flipped-bit costs: T1 1010 and T2 0110 at 0, T2 0010 at 0.006, T1 1011 at 0.014, T1 1110 at 0.096, T1 1111 at 0.110. Then it stops, as more probes are unlikely to help, and skips T2 0111 at 0.168 and T2 0011 at 0.174.">
