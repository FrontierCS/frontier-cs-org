<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 20 760 280" role="img" aria-label="Two hash tables of one query. Each shows four projection values, the bits they give, and the cost of flipping each bit. The agent writes the global probe order: buckets from both tables sorted by distance, the sum of flipped-bit costs, with a stop point after which buckets are skipped.">

