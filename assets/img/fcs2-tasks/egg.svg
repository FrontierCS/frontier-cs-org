<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" role="img" aria-label="An e-graph just after a rewrite merged class c1, holding foo, with class c2, holding (* 1 c1). Classes c3 and c4 now hold congruent nodes, pow of c1 and pow of c2, but are still apart. The agent writes the deferred rebuild: it takes the pending parent nodes, rewrites their children to canonical ids, finds that (pow c1 2) is already in the memo table under c3, unions c3 and c4, and updates analysis data. Afterwards one class holds foo and (* 1 c1) and one class holds (pow c1 2).">
<defs><marker id="egg-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3c4043"/></marker></defs>
<text x="20" y="22" font-size="12.5" fill="#5f6368">One rebuild of an e-graph; each box is an e-class of equal expressions</text>
<text x="22" y="52" font-size="12.5" fill="#1f1f1f">before: c1 and c2 just merged</text>
<rect x="22" y="64" width="188" height="30" rx="8" fill="#fff" stroke="#9aa0a6" stroke-width="1.2"/>
<text x="32" y="83" font-size="11.5" fill="#5f6368">c3</text>
<text x="62" y="84" font-size="12.5" fill="#1f1f1f" font-family="ui-monospace,Menlo,monospace">(pow c1 2)</text>
<rect x="22" y="102" width="188" height="30" rx="8" fill="#fff" stroke="#c5221f" stroke-width="1.2"/>
<text x="32" y="121" font-size="11.5" fill="#5f6368">c4</text>
<text x="62" y="122" font-size="12.5" fill="#1f1f1f" font-family="ui-monospace,Menlo,monospace">(pow c2 2)</text>
<text x="22" y="152" font-size="12" fill="#c5221f">congruent to c3, yet a separate class</text>
<rect x="22" y="168" width="72" height="30" rx="8" fill="#fff" stroke="#9aa0a6" stroke-width="1.2"/>
<text x="32" y="187" font-size="11.5" fill="#5f6368">c1</text>
<text x="54" y="188" font-size="12.5" fill="#1f1f1f" font-family="ui-monospace,Menlo,monospace">foo</text>
<text x="103" y="188" font-size="14" text-anchor="middle" fill="#1f1f1f">=</text>
<rect x="112" y="168" width="98" height="30" rx="8" fill="#fff" stroke="#9aa0a6" stroke-width="1.2"/>
<text x="120" y="187" font-size="11.5" fill="#5f6368">c2</text>
<text x="140" y="188" font-size="12.5" fill="#1f1f1f" font-family="ui-monospace,Menlo,monospace">(* 1 c1)</text>
<text x="22" y="218" font-size="12" fill="#5f6368">recorded, not yet repaired</text>
<line x1="214" y1="116" x2="232" y2="116" stroke="#3c4043" stroke-width="1.3" marker-end="url(#egg-ar)"/>
<rect x="236" y="34" width="288" height="246" rx="12" fill="#e8f0fe" stroke="#0b57d0" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="252" y="58" font-size="14" font-weight="600" fill="#0b57d0">The agent writes: the deferred rebuild</text>
<text x="252" y="77" font-size="12.5" fill="#3c4043">runs once after a whole batch of merges</text>
<text x="252" y="104" font-size="12" fill="#5f6368">pending parent</text>
<rect x="346" y="90" width="160" height="22" fill="#fff" stroke="#3c4043" stroke-width="1.2"/>
<text x="356" y="105" font-size="12.5" fill="#1f1f1f" font-family="ui-monospace,Menlo,monospace">(pow c2 2) in c4</text>
<text x="252" y="138" font-size="12" fill="#5f6368">memo table: e-node to class</text>
<rect x="252" y="146" width="254" height="24" fill="#fff" stroke="#3c4043" stroke-width="1.2"/>
<line x1="440" y1="146" x2="440" y2="194" stroke="#3c4043" stroke-width="1.2"/>
<text x="264" y="163" font-size="12.5" fill="#1f1f1f" font-family="ui-monospace,Menlo,monospace">(pow c1 2)</text>
<text x="473" y="163" font-size="12.5" text-anchor="middle" fill="#1f1f1f" font-family="ui-monospace,Menlo,monospace">c3</text>
<rect x="252" y="170" width="254" height="24" fill="#fff" stroke="#c5221f" stroke-width="1.4"/>
<text x="264" y="187" font-size="12.5" fill="#1f1f1f" font-family="ui-monospace,Menlo,monospace">(pow c1 2)</text>
<text x="473" y="187" font-size="12.5" text-anchor="middle" fill="#c5221f" font-family="ui-monospace,Menlo,monospace">c4?</text>
<text x="252" y="214" font-size="12" fill="#c5221f">c2 becomes c1, so the key is already taken</text>
<text x="252" y="238" font-size="12.5" fill="#1f1f1f">so union c3 and c4, update analysis data,</text>
<text x="252" y="256" font-size="12.5" fill="#1f1f1f">and repeat until nothing is pending</text>
<line x1="526" y1="116" x2="544" y2="116" stroke="#3c4043" stroke-width="1.3" marker-end="url(#egg-ar)"/>
<text x="550" y="52" font-size="12.5" fill="#1f1f1f">after: the invariants hold</text>
<rect x="550" y="64" width="190" height="50" rx="8" fill="#fff" stroke="#9aa0a6" stroke-width="1.2"/>
<text x="560" y="83" font-size="11.5" fill="#5f6368">c1</text>
<text x="590" y="84" font-size="12.5" fill="#1f1f1f" font-family="ui-monospace,Menlo,monospace">foo</text>
<text x="590" y="103" font-size="12.5" fill="#1f1f1f" font-family="ui-monospace,Menlo,monospace">(* 1 c1)</text>
<rect x="550" y="124" width="190" height="30" rx="8" fill="#fff" stroke="#9aa0a6" stroke-width="1.2"/>
<text x="560" y="143" font-size="11.5" fill="#5f6368">c3</text>
<text x="590" y="144" font-size="12.5" fill="#1f1f1f" font-family="ui-monospace,Menlo,monospace">(pow c1 2)</text>
<text x="550" y="178" font-size="12" fill="#5f6368">every id canonical,</text>
<text x="550" y="195" font-size="12" fill="#5f6368">congruent nodes in one class,</text>
<text x="550" y="212" font-size="12" fill="#5f6368">memo table consistent</text>
</svg>
