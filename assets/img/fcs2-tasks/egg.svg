<svg xmlns="http://www.w3.org/2000/svg" class="fig2" viewBox="0 0 760 292" role="img" aria-label="Each box is an e-class of equal expressions. Left, what is given: an e-graph just after a rewrite merged class c1, holding foo, with class c2, holding (* 1 c1); classes c3 and c4 now hold congruent nodes, (pow c1 2) and (pow c2 2), but are still apart. Middle, the deferred rebuild the agent writes, run once per batch of merges: it takes the pending parent (pow c2 2) in c4, rewrites c2 to the canonical c1, finds (pow c1 2) already in the memo table under c3, unions c3 and c4 and updates analysis data, repeating until nothing is pending. Right, afterwards: one class holds foo and (* 1 c1), one class holds (pow c1 2), and the invariants hold.">
<defs><marker id="egg-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="arh" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="given" x="0" y="0" width="214" height="292" rx="10"/>
<text class="k" x="18" y="30">GIVEN</text>
<text x="18" y="56">c1 and c2 just merged</text>
<rect class="chip" x="18" y="70" width="178" height="30" rx="6"/>
<text class="sm n" x="30" y="89.5">c3</text>
<text class="code" x="54" y="90">(pow c1 2)</text>
<rect class="chip" x="18" y="106" width="178" height="30" rx="6"/>
<rect class="sbad" x="18" y="106" width="178" height="30" rx="6"/>
<text class="sm n" x="30" y="125.5">c4</text>
<text class="code" x="54" y="126">(pow c2 2)</text>
<text class="bad" x="18" y="156">congruent to c3, yet</text>
<text class="bad" x="18" y="174">a separate class</text>
<rect class="chip" x="18" y="192" width="62" height="30" rx="6"/>
<text class="sm n" x="28" y="211.5">c1</text>
<text class="code" x="46" y="212">foo</text>
<text class="mid" x="89" y="211">=</text>
<rect class="chip" x="98" y="192" width="98" height="30" rx="6"/>
<text class="sm n" x="108" y="211.5">c2</text>
<text class="code" x="128" y="212">(* 1 c1)</text>
<text class="n" x="18" y="246">recorded, not yet repaired</text>
<rect class="agent" x="230" y="0" width="320" height="292" rx="10"/>
<text class="k ak" x="250" y="30">THE AGENT WRITES</text>
<text class="h" x="250" y="53">The deferred rebuild, once per batch</text>
<circle class="chip" cx="259" cy="83.5" r="9"/><text class="sn ak" x="259" y="88" text-anchor="middle">1</text>
<text x="276" y="88">Take a pending parent node</text>
<rect class="chip" x="250" y="100" width="150" height="28" rx="5"/>
<text class="code" x="262" y="118.5">(pow c2 2) in c4</text>
<circle class="chip" cx="259" cy="149.5" r="9"/><text class="sn ak" x="259" y="154" text-anchor="middle">2</text>
<text x="276" y="154">c2 becomes c1; the memo has the key</text>
<rect class="w" x="250" y="166" width="280" height="24" rx="5"/>
<text class="code" x="262" y="182.5">(pow c1 2)</text>
<text class="code mid" x="500" y="182.5">c3</text>
<rect class="w" x="250" y="193" width="280" height="24" rx="5"/>
<rect class="sbad" x="250" y="193" width="280" height="24" rx="5"/>
<text class="code" x="262" y="209.5">(pow c1 2)</text>
<text class="code mid bad" x="500" y="209.5">c4?</text>
<line class="ln" x1="470" y1="170" x2="470" y2="213"/>
<circle class="chip" cx="259" cy="241.5" r="9"/><text class="sn ak" x="259" y="246" text-anchor="middle">3</text>
<text x="276" y="246">Union c3 and c4, update analysis</text>
<text class="n" x="250" y="272">Repeat until nothing is pending.</text>
<rect class="result" x="566" y="0" width="194" height="292" rx="10"/>
<text class="k" x="584" y="30">AFTER</text>
<text x="584" y="56">The invariants hold</text>
<rect class="chip" x="584" y="70" width="158" height="49" rx="6"/>
<text class="sm n" x="596" y="89.5">c1</text>
<text class="code" x="620" y="90">foo</text>
<text class="code" x="620" y="109">(* 1 c1)</text>
<rect class="chip" x="584" y="127" width="158" height="30" rx="6"/>
<text class="sm n" x="596" y="146.5">c3</text>
<text class="code" x="620" y="147">(pow c1 2)</text>
<text class="n" x="584" y="184">Every id is canonical,</text>
<text class="n" x="584" y="202">congruent nodes share</text>
<text class="n" x="584" y="220">a class, and the memo</text>
<text class="n" x="584" y="238">table is consistent.</text>
</svg>
