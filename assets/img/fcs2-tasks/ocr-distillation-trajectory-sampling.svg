<svg xmlns="http://www.w3.org/2000/svg" class="fig2" viewBox="0 0 760 310" role="img" aria-label="Left, what is given: the student, Stable Diffusion 3.5 Medium, and a prompt that quotes the text to draw, such as Take With Food. Middle, what the agent writes. Step 1, the sampler: it runs the student from noise x0 to the latent x10 in ten steps and returns every state and each step’s log-probability. Step 2, the step: the student’s prediction sets the mean of a Gaussian, the step draws the next state from it and returns its log-probability, and replay gives the same mean and score. Right, how it is judged: a fixed decoder makes the image and optical character recognition reads its words.">
