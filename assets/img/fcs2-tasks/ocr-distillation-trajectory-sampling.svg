<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 20 760 254" role="img" aria-label="The student turns noise x0 into a latent x10 in ten noisy steps; a fixed decoder makes the image, and optical character recognition reads its words. The agent writes the sampler, which runs and records the chain, and the step, which draws the next state from a Gaussian around the mean and returns its log-probability; replay must give the same mean and log-probability again.">
