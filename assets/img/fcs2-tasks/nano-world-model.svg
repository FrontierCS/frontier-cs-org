<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-label="Sampling three future frames from one real frame. Frame f0 is the encoded real frame and f1 to f3 start as noise; actions a1 to a3 link consecutive frames. A fixed trained model reads the noisy frames, their noise levels and the actions, and makes a prediction. The part the agent writes is the noise schedule, a matrix of noise levels per frame and step, here sequential so f1 finishes before f2 and f2 before f3 while f0 stays at 0.02, and the update that moves the frames from one row of the schedule to the next.">
