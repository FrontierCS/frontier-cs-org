<text class="n" x="242" y="312">Noise level: 1 is pure noise, 0 is clean.</text>
<circle class="chip" cx="549" cy="81.5" r="9"/><text class="sn ak" x="549" y="86" text-anchor="middle">2</text>
<text x="566" y="86">The update, once per row</text>
<text x="540" y="128">Ask the model for a prediction,</text>
<text x="540" y="146">estimate each clean frame,</text>
<text x="540" y="164">move each frame to its next</text>
<text x="540" y="182">noise level.</text>
<text class="n" x="540" y="226">Sequential here: f1 finishes,</text>
<text class="n" x="540" y="244">then f2, then f3. f0 stays at</text>
<text class="n" x="540" y="262">.02 to keep the history steady.</text>
</svg>
