<text class="mid" x="172" y="74">a₃</text>
<text class="n mid" x="132" y="110">actions</text>
<text class="n" x="18" y="140">f0 is the real frame,</text>
<text class="n" x="18" y="158">encoded.</text>
<rect class="chip" x="18" y="186" width="170" height="100" rx="6"/>
<text class="b" x="30" y="208">Trained model, fixed</text>
<text class="n" x="30" y="232">Reads the noisy frames,</text>
<text class="n" x="30" y="250">their noise levels and</text>
<text class="n" x="30" y="268">the actions</text>
<rect class="agent" x="222" y="0" width="538" height="330" rx="10"/>
<text class="k ak" x="242" y="30">THE AGENT WRITES</text>
<text class="h" x="242" y="53">The sampler, which sets noise per frame and step</text>
<circle class="chip" cx="251" cy="81.5" r="9"/><text class="sn ak" x="251" y="86" text-anchor="middle">1</text>
