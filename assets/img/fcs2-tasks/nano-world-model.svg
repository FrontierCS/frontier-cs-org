<text class="code num mid" x="484" y="235.5">1</text>
<rect class="chip" x="314" y="245" width="46" height="22" rx="3"/>
<text class="code num mid" x="337" y="260.5">.02</text>
<rect class="chip" x="363" y="245" width="46" height="22" rx="3"/>
<text class="code num mid" x="386" y="260.5">0</text>
<rect class="chip" x="412" y="245" width="46" height="22" rx="3"/>
<text class="code num mid" x="435" y="260.5">0</text>
<rect class="g3" x="461" y="245" width="46" height="22" rx="3"/>
<text class="code num mid" x="484" y="260.5">.5</text>
<text class="n end" x="304" y="285.5">step 250</text>
