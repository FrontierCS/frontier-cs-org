<text class="k" x="18" y="30">GIVEN</text>
<rect class="chip" x="18" y="46" width="46" height="46" rx="4"/>
<path class="lnk" d="M28 58v24h14"/>
<path class="lnk" d="M54 80v-24h-12"/>
<circle class="ink" cx="40" cy="70" r="3.6"/>
<text class="code mid" x="41" y="110">f0</text>
<rect class="chip pad" x="76" y="55" width="32" height="28" rx="5"/>
