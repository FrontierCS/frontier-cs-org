<svg xmlns="http://www.w3.org/2000/svg" class="fig2" viewBox="0 0 760 330" role="img" aria-label="Left, what is given: the encoded real frame f0, the actions a1 to a3 and the trained model, which stays fixed and reads the noisy frames, their noise levels and the actions. Right, the sampler the agent writes. Step 1, the schedule: a noise level for each frame f0 to f3 at each step from 1 to 250, here sequential, so f1 finishes before f2 and f2 before f3, while f0 stays at 0.02. Step 2, the update for each row: ask the model for a prediction, estimate each clean frame and move each frame to its next noise level. A noise level of 1 is pure noise and 0 is clean.">
