<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 26 760 244" role="img" aria-label="A data graph feeds a batch of small query patterns, each with one marked orbit vertex. The batch mode, which the agent writes, plans all queries together so that shared pieces such as a wedge or a triangle are counted once and reused. The output is one exact count per data vertex for every query, for example 37589, 342369 and 81862 for the first three vertices.">
