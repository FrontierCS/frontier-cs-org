<text x="104" y="244" font-size="13" text-anchor="middle" fill="#1f1f1f">data graph</text>
<text x="104" y="262" font-size="12" text-anchor="middle" fill="#5f6368">thousands of vertices</text>
<line x1="196" y1="150" x2="226" y2="150" stroke="#3c4043" stroke-width="1.3" marker-end="url(#scope-ar)"/>
<rect x="230" y="40" width="316" height="234" rx="12" fill="#e8f0fe" stroke="#0b57d0" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="246" y="64" font-size="14" font-weight="600" fill="#0b57d0">The agent writes: shared batch counting</text>
<text x="246" y="83" font-size="12.5" fill="#3c4043">one plan for the batch, shared pieces counted once</text>
<g stroke="#3c4043" stroke-width="1.3">
<line x1="250" y1="124" x2="330" y2="124"/>
<line x1="372" y1="110" x2="404" y2="110"/><line x1="404" y1="110" x2="404" y2="140"/><line x1="404" y1="140" x2="372" y2="140"/><line x1="372" y1="140" x2="372" y2="110"/>
