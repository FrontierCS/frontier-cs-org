<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" role="img" aria-label="A data graph feeds a batch of small query patterns, each with one marked orbit vertex. The batch mode, which the agent writes, plans all queries together so that shared pieces such as a wedge or a triangle are counted once and reused. The output is one exact count per data vertex for every query, for example 37589, 342369 and 81862 for the first three vertices.">
<defs><marker id="scope-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3c4043"/></marker><marker id="scope-up" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa0a6"/></marker></defs>
<text x="20" y="24" font-size="12.5" fill="#5f6368">One batch of local counting queries on one data graph</text>
<g stroke="#9aa0a6" stroke-width="1.2">
<line x1="58" y1="92" x2="122" y2="72"/><line x1="58" y1="92" x2="96" y2="140"/><line x1="122" y1="72" x2="166" y2="112"/><line x1="122" y1="72" x2="96" y2="140"/><line x1="96" y1="140" x2="142" y2="172"/><line x1="166" y1="112" x2="142" y2="172"/><line x1="96" y1="140" x2="44" y2="166"/><line x1="44" y1="166" x2="82" y2="206"/><line x1="82" y1="206" x2="142" y2="172"/><line x1="142" y1="172" x2="176" y2="204"/><line x1="166" y1="112" x2="176" y2="204"/><line x1="32" y1="116" x2="58" y2="92"/><line x1="32" y1="116" x2="44" y2="166"/>
</g>
<g fill="#fff" stroke="#3c4043" stroke-width="1.3">
<circle cx="58" cy="92" r="6"/><circle cx="122" cy="72" r="6"/><circle cx="166" cy="112" r="6"/><circle cx="96" cy="140" r="6"/><circle cx="44" cy="166" r="6"/><circle cx="142" cy="172" r="6"/><circle cx="82" cy="206" r="6"/><circle cx="176" cy="204" r="6"/><circle cx="32" cy="116" r="6"/>
</g>
<text x="56" y="77" font-size="12" text-anchor="middle" fill="#1f1f1f">0</text>
<text x="122" y="57" font-size="12" text-anchor="middle" fill="#1f1f1f">1</text>
