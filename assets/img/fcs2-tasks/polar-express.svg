<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 22 760 276" role="img" aria-label="A matrix G with singular values from 0.001 to 1 goes through five polynomial steps. Each step applies an odd fifth-degree polynomial chosen for the range of singular values left by the step before. The singular values spread over zero to two, then close in on one, so the output approximates the polar factor U V transpose. The polynomial schedule and the matrix iteration are the part the agent writes.">
