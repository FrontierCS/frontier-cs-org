<svg xmlns="http://www.w3.org/2000/svg" class="fig2" viewBox="0 0 760 326" role="img" aria-label="Left, what is given: a matrix G equal to U Sigma V transpose, with singular values from 0.001 to 1. Middle, the polynomial schedule and the matrix iteration the agent writes: each step sets X to aX + bX(XᵀX) + cX(XᵀX)², where a, b and c give the best fifth-degree odd polynomial for the range of singular values the step before leaves. Over five steps the singular values spread over zero to two, then close in on one. Right, the result: X approximates the polar factor U V transpose, with all singular values near 1.">
