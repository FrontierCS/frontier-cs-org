<svg xmlns="http://www.w3.org/2000/svg" class="fig2" viewBox="0 0 760 300" role="img" aria-label="A toy structured-LWE instance with q = 97. Left, what is given: a public 5 by 4 matrix A and a public vector b, where b = A·s + e mod 97 for a small secret s and a small error e. Middle, the solver the agent writes, by lattice reduction, sparsity or any other attack: it finds s = (1, 0, −1, 1), and then b − A·s is (1, −2, 0, 1, −1). Right, a secret is accepted if it uses only −1, 0 and 1 with exactly three nonzeros and every entry of b − A·s, centered mod 97, is at most 2 in size. There are 200 instances in ten families.">
<defs><marker id="structured-lwe-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="arh" d="M0 0L10 5L0 10z"/></marker></defs>
