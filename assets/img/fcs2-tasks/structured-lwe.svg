<text class="code mid" x="152" y="172">78</text>
<text class="code mid" x="44" y="200">23</text>
<text class="code mid" x="80" y="200">12</text>
<text class="code mid" x="116" y="200">57</text>
<text class="code mid" x="152" y="200">38</text>
<text class="code mid" x="44" y="228">18</text>
<text class="code mid" x="80" y="228">11</text>
<text class="code mid" x="116" y="228">68</text>
<text class="code mid" x="152" y="228">88</text>
<path class="ln2" d="M200 96H194V226H200M228 96H234V226H228"/>
<text class="code mid" x="214" y="116">56</text>
<text class="code mid" x="214" y="144">62</text>
<text class="code mid" x="214" y="172">63</text>
<text class="code mid" x="214" y="200">5</text>
<text class="code mid" x="214" y="228">37</text>
<text class="n" x="18" y="262">b = A·s + e mod 97, with</text>
<text class="n" x="18" y="280">s and e small and unknown</text>
<rect class="agent" x="278" y="0" width="240" height="300" rx="10"/>
<text class="k ak" x="298" y="30">THE AGENT WRITES</text>
<text class="h" x="298" y="53">The solver, which finds s</text>
<text class="n mid" x="328" y="84">secret s</text>
<rect class="chip on" x="308" y="99" width="40" height="24" rx="5"/>
<text class="code ak b mid" x="328" y="116">1</text>
<rect class="chip on" x="308" y="127" width="40" height="24" rx="5"/>
<text class="code ak b mid" x="328" y="144">0</text>
<rect class="chip on" x="308" y="155" width="40" height="24" rx="5"/>
<text class="code ak b mid" x="328" y="172">−1</text>
<rect class="chip on" x="308" y="183" width="40" height="24" rx="5"/>
<text class="code ak b mid" x="328" y="200">1</text>
<text class="n mid" x="438" y="84">b − A·s</text>
