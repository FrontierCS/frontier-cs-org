<text class="code mid" x="438" y="200">1</text>
<text class="code mid" x="438" y="228">−1</text>
<text class="n" x="298" y="262">by lattice reduction, sparsity</text>
<text class="n" x="298" y="280">or any other attack</text>
<rect class="result" x="534" y="0" width="226" height="300" rx="10"/>
<text class="k" x="552" y="30">ACCEPTED WHEN</text>
<text x="552" y="62">s uses only −1, 0 and 1,</text>
<text x="552" y="80">s has exactly three</text>
<text x="552" y="98">nonzeros, and each entry</text>
<text x="552" y="116">of b − A·s, centered</text>
