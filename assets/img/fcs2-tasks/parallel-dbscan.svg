<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 20 760 254" role="img" aria-label="Points sit on a grid whose cells have diagonal epsilon, so points in one cell are close. Core points are filled. The agent writes the core-cell connectivity: it links neighboring cells that hold core points within epsilon of each other, rejects a pair of cells whose closest core points are farther apart, and gives each core cell a component id, here 1 or 2. The given code then adds border points to every component they touch, such as point 11 in components 1 and 2, and drops noise.">
