<svg xmlns="http://www.w3.org/2000/svg" class="fig2" viewBox="0 0 760 300" role="img" aria-label="Left, what is given: points on a grid whose cells have diagonal epsilon, so points in one cell are close; core points are filled. Middle, the links between core cells, which the agent writes: it links neighboring cells whose core points lie within epsilon of each other, rejects a pair of cells whose closest core points are farther apart, and gives each core cell a component id, here 1 or 2. Right, the output: the given code then adds border points to every component they touch, such as point 11 in components 1 and 2, and drops noise such as point 12.">
<defs><marker id="parallel-dbscan-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="arh" d="M0 0L10 5L0 10z"/></marker></defs>
