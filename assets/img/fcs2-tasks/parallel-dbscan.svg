<text class="code" x="650" y="198">2</text>
<text class="code" x="598" y="218">11</text>
<text class="code" x="650" y="218">1 2</text>
<text class="n" x="586" y="258">Point 12 is noise:</text>
<text class="n" x="586" y="276">it gets no record.</text>
