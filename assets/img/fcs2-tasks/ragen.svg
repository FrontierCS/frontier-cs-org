<svg xmlns="http://www.w3.org/2000/svg" class="fig2" viewBox="0 0 760 290" role="img" aria-label="Left, what is given: a 6 by 6 Sokoban view, the model that replies and the trainer. Right, the context manager the agent writes. It parses a reply such as Right, Up, Left into at most two moves, and packs one game into a left-padded token row of instructions, views and replies; the mask is 1 only on the replies and the reward of 10.8 sits on the last reply token. Four games from the same start form one group.">
