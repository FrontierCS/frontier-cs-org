<svg xmlns="http://www.w3.org/2000/svg" class="fig2" viewBox="0 0 760 296" role="img" aria-label="Left, what is given: twelve keys, each shown by its bucket, after counting has fixed the three bucket intervals. Region 0 holds 2 keys of bucket 1, region 1 holds 2 of bucket 2 and region 2 holds 2 of bucket 0, a cycle in the region graph; an edge i to j means region i holds keys of bucket j. Right, the swap planner the agent writes. 1, round 1 swaps positions 2–3 with 6–7, which leaves a two-way cycle between regions 0 and 2, 2 keys each way. 2, after updating the graph, round 2 swaps 2–3 with 10–11; the graph is empty and the keys are sorted. Swaps in one round run at once and must not overlap.">
