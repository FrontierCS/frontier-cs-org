<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 296" role="img" aria-label="Twelve keys, shown by bucket, must end in three bucket intervals. At the start, region 0 holds 2 keys of bucket 1, region 1 holds 2 of bucket 2 and region 2 holds 2 of bucket 0, a cycle in the region graph. Round 1 swaps positions 2–3 with 6–7, leaving a two-way cycle between regions 0 and 2; round 2 swaps 2–3 with 10–11 and the graph is empty. Planning these swaps and updating the graph is what the agent writes.">
