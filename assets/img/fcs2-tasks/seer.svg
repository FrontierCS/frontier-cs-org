<text class="n sm" x="166" y="248">T taken, N not taken,</text>
<text class="n sm" x="166" y="266">? unsure</text>
<rect class="agent" x="366" y="0" width="394" height="288" rx="10"/>
<text class="k ak" x="386" y="30">THE AGENT WRITES</text>
<text class="h" x="386" y="53">The branch predictor, one per branch</text>
<text class="n" x="386" y="86">State, for example the recent directions</text>
<rect class="chip" x="386" y="98" width="28" height="26" rx="5"/>
<text class="code mid" x="400" y="116">T</text>
<rect class="chip" x="418" y="98" width="28" height="26" rx="5"/>
<text class="code mid" x="432" y="116">T</text>
