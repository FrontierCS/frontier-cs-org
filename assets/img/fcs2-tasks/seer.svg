<circle class="chip" cx="395" cy="155.5" r="9"/><text class="sn ak" x="395" y="160" text-anchor="middle">1</text>
<text x="412" y="160">Guess, before the block runs</text>
<text class="code b end" x="740" y="160">taken</text>
<circle class="chip" cx="395" cy="191.5" r="9"/><text class="sn ak" x="395" y="196" text-anchor="middle">2</text>
<text x="412" y="196">Real direction, as it runs</text>
<text class="code b bad end" x="740" y="196">not taken</text>
<text class="sm bad end" x="740" y="216">a miss</text>
<circle class="chip" cx="395" cy="243.5" r="9"/><text class="sn ak" x="395" y="248" text-anchor="middle">3</text>
<text x="412" y="248">Learn: update the state</text>
<text class="n sm" x="412" y="268">or answer unsure when the branch is hard to call</text>
</svg>
