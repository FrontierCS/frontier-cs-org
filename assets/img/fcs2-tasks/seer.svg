<text class="code ak b mid" x="305.0" y="114.5">T</text>
<rect class="chip" x="166" y="130" width="116" height="28" rx="6"/>
<text class="code sm" x="178" y="148.5">0x7a25…:41c</text>
<rect class="chip on" x="288" y="130" width="34" height="28" rx="6"/>
<text class="code ak b mid" x="305.0" y="148.5">?</text>
<rect class="chip" x="166" y="164" width="116" height="28" rx="6"/>
<text class="code sm" x="178" y="182.5">0xa0b8…:0c4</text>
<rect class="chip on" x="288" y="164" width="34" height="28" rx="6"/>
<text class="code ak b mid" x="305.0" y="182.5">N</text>
<rect class="chip" x="166" y="198" width="116" height="28" rx="6"/>
<text class="code sm" x="178" y="216.5">0xdac1…:1f2</text>
<rect class="chip on" x="288" y="198" width="34" height="28" rx="6"/>
