<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 18 760 250" role="img" aria-label="A contract call passes three state-dependent branches. Each branch has its own predictor in a branch table. A predictor guesses taken, not taken or unsure before the block runs, then learns from the direction the branch really took. The predictors are the part the agent writes.">
