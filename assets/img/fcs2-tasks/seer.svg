<svg xmlns="http://www.w3.org/2000/svg" class="fig2" viewBox="0 0 760 288" role="img" aria-label="Left, what is given: a contract call passes three state-dependent branches, and a branch table maps each contract and branch to its own predictor, whose answer is T for taken, N for not taken or ? for unsure. Right, the branch predictor the agent writes: it keeps state, for example the recent directions; it guesses taken before the block runs, sees the real direction, here not taken, a miss, and then learns by updating its state, or answers unsure when the branch is hard to call.">
<defs><marker id="seer-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="arh" d="M0 0L10 5L0 10z"/></marker></defs>
