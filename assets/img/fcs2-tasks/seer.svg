<text class="code mid" x="77.0" y="80.5">JUMPI 0x1a3</text>
<rect class="chip" x="18" y="126" width="118" height="28" rx="6"/>
<text class="code mid" x="77.0" y="144.5">JUMPI 0x2f0</text>
<rect class="chip" x="18" y="190" width="118" height="28" rx="6"/>
<text class="code mid" x="77.0" y="208.5">JUMPI 0x41c</text>
<line class="ar" x1="77.0" y1="92" x2="77.0" y2="122" marker-end="url(#seer-ar)"/>
<text class="n sm" x="86.0" y="111.0">taken</text>
<line class="ar" x1="77.0" y1="156" x2="77.0" y2="186" marker-end="url(#seer-ar)"/>
<text class="n sm" x="86.0" y="175.0">not taken</text>
<line class="ar" x1="77.0" y1="220" x2="77.0" y2="244" marker-end="url(#seer-ar)"/>
<text class="n sm" x="86.0" y="236.0">taken</text>
<text class="n" x="166" y="53">Branch table</text>
<rect class="chip" x="166" y="62" width="116" height="28" rx="6"/>
<text class="code sm" x="178" y="80.5">0x7a25…:1a3</text>
<rect class="chip on" x="288" y="62" width="34" height="28" rx="6"/>
<text class="code ak b mid" x="305.0" y="80.5">T</text>
<rect class="chip" x="166" y="96" width="116" height="28" rx="6"/>
<text class="code sm" x="178" y="114.5">0x7a25…:2f0</text>
