---
layout: default
---

<section class="page-hero">
  <div class="page" id="main" tabindex="-1">
    <p class="eyebrow">Tag</p>
    <h1>{{ page.title }}</h1>
    <p class="lede">{{ page.posts.size }} post{% if page.posts.size != 1 %}s{% endif %} tagged "{{ page.title }}".</p>
  </div>
</section>

<section class="journal">
  <div class="page">
    <div class="post-list">
      {% for post in page.posts %}
      {% include blog_card.html post=post %}
      {% endfor %}
    </div>
  </div>
</section>
